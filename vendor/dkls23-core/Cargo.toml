[package]
name = "dkls23-core"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — curve-generic core (Tenzro vendored fork — Set A RustCrypto pins)"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

# Tenzro vendored fork of dkls23-core 0.5.1 with deps bumped to the
# coherent RustCrypto Set A (k256 0.14.0-rc.12, elliptic-curve
# 0.14.0-rc.35, ff 0.14.0, group 0.14.0). Upstream 0.5.1 pinned the
# archaeologically-incompatible `rustcrypto-ff`/`rustcrypto-group`
# crates (rc.0, 2026-02-02) that were temporarily renamed and then
# reverted upstream. Drop this vendor when DKLs23 ships 0.5.2.

[dependencies]
elliptic-curve = { version = "=0.14.0-rc.35", features = ["arithmetic", "sec1"] }
ff = "=0.14.0"
group = "=0.14.0"
k256 = { version = "=0.14.0-rc.12" }
sha2 = "0.11.0-rc.5"
hmac = "0.13.0-rc.5"
ripemd = "0.2.0-rc.5"
rand = "0.10"
hex = "0.4"
bincode = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.12", optional = true }
zeroize = { version = "1", features = ["derive"] }
subtle = "2.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[dev-dependencies]
serde_json = "1"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes", "dep:bincode", "k256/serde"]
insecure-rng = []
