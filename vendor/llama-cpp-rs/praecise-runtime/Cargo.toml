[package]
name = "praecise-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Praecise general inference-acceleration runtime: speculative decode (DFlash/MTP), sampling, and the backend-agnostic inference API. Sits on top of a backend (llama.cpp first) that is either bundled or provided by the host."

[dependencies]
# The llama.cpp backend is OPTIONAL. Enable `bundled-llama` for standalone use
# (Praecise pulls and builds the backend). A host application that already links
# llama-cpp-2 depends on this crate WITHOUT the feature and provides its own
# backend handle, so the backend — and its GPU context — loads once rather than
# being duplicated.
llama-cpp-2 = { path = "../llama-cpp-2", optional = true }
thiserror = "2"
tracing = "0.1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync"] }

[features]
default = []
# Bundle and build the llama.cpp backend for standalone use. Omit when the host
# application already provides llama-cpp-2.
bundled-llama = ["dep:llama-cpp-2"]
# Backend accelerators — only meaningful with a bundled backend, so each implies
# `bundled-llama`.
cuda = ["bundled-llama", "llama-cpp-2/cuda"]
cuda-no-vmm = ["bundled-llama", "llama-cpp-2/cuda-no-vmm"]
rocm = ["bundled-llama", "llama-cpp-2/rocm"]
metal = ["bundled-llama", "llama-cpp-2/metal"]
vulkan = ["bundled-llama", "llama-cpp-2/vulkan"]
