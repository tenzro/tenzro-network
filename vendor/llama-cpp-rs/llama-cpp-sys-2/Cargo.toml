[package]
name = "llama-cpp-sys-2"
description = "Low Level Bindings to llama.cpp"
version = "0.1.147"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/utilityai/llama-cpp-rs"
links = "llama"

include = [
    "wrapper.h",
    "wrapper_common.h",
    "wrapper_common.cpp",
    "wrapper_oai.h",
    "wrapper_oai.cpp",
    "wrapper_utils.h",
    "wrapper_mtmd.h",
    "build.rs",
    "/src",

    "/llama.cpp/common/**/*.h",
    "/llama.cpp/common/**/*.hpp",
    "/llama.cpp/common/**/*.cpp",
    "/llama.cpp/ggml/include/*.h",
    "/llama.cpp/ggml/src/*.h",
    "/llama.cpp/ggml/src/*.c",
    "/llama.cpp/ggml/src/*.cpp",
    "/llama.cpp/src/*.h",
    "/llama.cpp/src/*.cpp",
    "/llama.cpp/src/models/*.h",
    "/llama.cpp/src/models/*.cpp",
    "/llama.cpp/tools/mtmd/*.h",
    "/llama.cpp/tools/mtmd/*.cpp",
    "/llama.cpp/tools/mtmd/models/*.h",
    "/llama.cpp/tools/mtmd/models/*.cpp",
    "/llama.cpp/tools/mtmd/debug/*.h",
    "/llama.cpp/tools/mtmd/debug/*.cpp",

    "/llama.cpp/convert_hf_to_gguf.py", # Yes, it's required
    "/llama.cpp/common/build-info.cpp.in",

    "/llama.cpp/ggml/src/ggml-cuda.cu",
    "/llama.cpp/ggml/src/ggml-metal.m",
    "/llama.cpp/ggml/src/ggml-metal.metal",

    "/llama.cpp/include/llama.h",
    "/llama.cpp/include/llama-cpp.h",

    "/llama.cpp/ggml/src/ggml-cpu/**/*",
    "/llama.cpp/ggml/src/ggml-cuda/**/*",
    "/llama.cpp/ggml/src/ggml-metal/**/*",
    "/llama.cpp/ggml/src/ggml-vulkan/**/*",
    "/llama.cpp/ggml/src/ggml-hip/**/*",

    "/llama.cpp/ggml/src/llamafile/sgemm.h",
    "/llama.cpp/ggml/src/llamafile/sgemm.cpp",

    "/llama.cpp/pocs",
    "/llama.cpp/vendor",

    "/llama.cpp/CMakeLists.txt",
    "/llama.cpp/common/CMakeLists.txt",
    "/llama.cpp/ggml/CMakeLists.txt",
    "/llama.cpp/ggml/src/CMakeLists.txt",
    "/llama.cpp/src/CMakeLists.txt",

    "/llama.cpp/cmake",
    "/llama.cpp/ggml/cmake",
    "/llama.cpp/common/cmake",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true, features = ["parallel"] }
cmake = "0.1"
find_cuda_helper = "0.2.0"
glob = "0.3.3"
walkdir = "2"

[features]
default = ["common"]
# Build the high-level OpenAI-compatible / chat-template / JSON-schema-to-grammar
# helpers backed by llama.cpp's `common/` static library. Disabling this drops
# `libcommon.a` (~14 MB) and the `wrapper_common.cpp` / `wrapper_oai.cpp`
# bindings (~10 MB combined static archive) from the link line, which matters
# for size-constrained downstream binaries that only need the core inference
# API. Enabled by default to preserve backwards compatibility.
common = []
cuda = []
# Disables the need to dynamically link against libcuda.so / cuda.dll
cuda-no-vmm = ["cuda"]
metal = []
dynamic-link = []
vulkan = []
openmp = []
rocm = []
# Intel oneAPI SYCL backend (Arc / Battlemage / Data Center GPU Max / integrated
# Xe). Requires the oneAPI DPC++ compiler (icpx) on PATH at build time; the
# build script points CMAKE_C/CXX_COMPILER at it and sets GGML_SYCL_TARGET=INTEL.
sycl = []
# OpenVINO backend — runs GGUF directly on Intel CPU / GPU / NPU. Requires an
# OpenVINO install discoverable by CMake (OpenVINO_DIR env). Runtime device
# selection via the GGML_OPENVINO_DEVICE env var (CPU / GPU / NPU).
openvino = []
# OpenCL backend — Qualcomm Adreno, ARM Mali, and other OpenCL 3.0 GPUs.
opencl = []
# Moore Threads MUSA backend (MTT S-series GPUs).
musa = []
# Huawei Ascend CANN backend (Ascend 910 / 310 NPUs).
cann = []
# WebGPU backend (Dawn) — cross-vendor GPU via the WebGPU API.
webgpu = []
# BLAS CPU acceleration (OpenBLAS / Intel MKL / Accelerate, per BLAS_VENDOR env).
blas = []
# IBM Z zDNN backend (Telum on-chip AI accelerator).
zdnn = []
# Only has an impact on Android.
shared-stdcxx = []
static-stdcxx = []
system-ggml = []
system-ggml-static = ["system-ggml"]
mtmd = []
dynamic-backends = ["dynamic-link"]
# Build the ggml RPC backend (GGML_RPC=ON) and the `rpc-server` binary. The
# binary's path is exported to dependents via `cargo:rpc_server_bin=<path>`.
# rpc-server is insecure on open networks; it is meant to be tunneled behind an
# authenticated transport by the consumer (see tenzro cluster serving runtime).
rpc = []
