[package]
name = "dkls23-secp256k1"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DKLs23 Threshold ECDSA — secp256k1 / Ethereum (Tenzro vendored fork — Set A RustCrypto pins)"
repository = "https://github.com/0xCarbon/DKLs23"
readme = "README.md"

# Companion to the vendored dkls23-core. See its Cargo.toml for the
# rationale on the Set A RustCrypto pins.

[dependencies]
dkls23-core = { version = "0.5", path = "../dkls23-core" }
elliptic-curve = { version = "=0.14.0-rc.35", features = ["sec1"] }
group = "=0.14.0"
k256 = { version = "=0.14.0-rc.12" }
sha2 = "0.11.0-rc.5"
sha3 = "0.11.0-rc.8"
keccak = "0.2"
ripemd = "0.2.0-rc.5"
hex = "0.4"
bech32 = "0.11"
bs58 = "0.5"

[dev-dependencies]
group = "=0.14.0"

[features]
default = ["serde"]
serde = ["dkls23-core/serde", "k256/serde"]
insecure-rng = ["dkls23-core/insecure-rng"]
