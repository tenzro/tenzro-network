[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tenzro-device-key"
version = "0.1.0"
description = "Hardware device keys for Python: public key, digest signing and attestation from the TPM 2.0 (Linux, Windows) or the Apple Secure Enclave. No key export, no software key."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
