[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenzro"
version = "0.2.0"
description = "Tenzro Network SDK: a thin core (every node RPC method, typed transactions signed in hardware) and capability subpackages for x402 payments and the publisher gate, settlement, delegated agents, bridge, inference and chain verification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The TPM / Secure Enclave binding (sdk/tenzro-py/native). Without it, and
# without key hardware, the SDK reads and builds but does not sign.
device = ["tenzro-device-key>=0.1"]
# Offline verification of OpenShell records (tenzro.agents.openshell): P-256,
# Ed25519 and ML-DSA-65, which cryptography has from release 50.
verify = ["cryptography>=50"]

[project.urls]
Homepage = "https://tenzro.com"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cryptography>=42",
]

[tool.hatch.build.targets.wheel]
packages = ["tenzro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
