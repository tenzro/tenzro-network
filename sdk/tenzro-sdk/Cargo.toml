# Empty [workspace] isolates this SDK from the parent monorepo workspace
# so `cargo test` / `cargo build` work when the SDK is opened standalone
# or synced to its own git repo.
[workspace]

[package]
name = "tenzro-sdk"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "Tenzro Network SDK: a typed client for every RPC the node serves, hardware-signed transactions, agents, inference, payments and settlement"
license = "Apache-2.0"
repository = "https://github.com/tenzro/tenzro-network"
homepage = "https://tenzro.com/docs/sdk"
documentation = "https://docs.rs/tenzro-sdk"
readme = "README.md"
keywords = ["tenzro", "blockchain", "ai", "agents", "sdk"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
categories = ["api-bindings", "cryptography", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Capabilities. The core (the node client, configuration, errors, types,
# access and sign-in, the signer interface and hardware and passkey signers,
# wallets and typed transaction builders) is always built. Each capability
# adds its modules and only the dependencies they need; `full`, the default,
# is all of them. A thin build:
#   tenzro-sdk = { version = "0.9", default-features = false, features = ["payments"] }
default = ["full"]
full = ["payments", "settlement", "agents", "bridge", "inference", "chain"]
# x402 payers and the publisher gate (a tower layer), MPP, Permit2, funding, purchases.
payments = ["settlement", "dep:tower", "dep:http", "dep:futures", "dep:uuid"]
# Escrow, the split engine and settlement plans.
settlement = []
# Delegated agents: registration, Terms, payments, governance, the task market.
agents = ["payments", "dep:uuid", "dep:ed25519-dalek", "dep:ml-dsa"]
# Bridge routes and fees, EIP-7702, agents' accounts on other chains.
bridge = ["dep:bs58", "dep:bech32", "dep:curve25519-dalek", "dep:blake2", "dep:sha3"]
# Models, chat streams, multimodal and media generation, providers, training, the catalog.
inference = ["dep:futures"]
# Tokens, staking, validators, governance, contracts, TEE and ZK, storage, events with proofs.
chain = ["dep:blake3", "dep:bincode", "dep:sha3"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
futures = { version = "0.3", optional = true }
hex = "0.4"
uuid = { version = "1", features = ["v4"], optional = true }
tracing = "0.1"
base64 = "0.22"
async-trait = "0.1"
http = { version = "1", optional = true }
tower = { version = "0.5", default-features = false, optional = true }
getrandom = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = { version = "0.10", optional = true }
blake2 = { version = "0.10", optional = true }
bs58 = { version = "0.5", optional = true }
bech32 = { version = "0.11", optional = true }
curve25519-dalek = { version = "4", optional = true }
blake3 = { version = "1", optional = true }
bincode = { version = "1.3", optional = true }
# OpenShell record verification: Ed25519 session keys and ML-DSA-65 legs.
ed25519-dalek = { version = "2", optional = true }
ml-dsa = { version = "0.1.1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
bincode = "1.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "wallet_operations"
path = "examples/wallet_operations.rs"

[[example]]
name = "local_node"
path = "examples/local_node.rs"

[[example]]
name = "ai_inference"
path = "examples/ai_inference.rs"
required-features = ["inference"]

# Each test needs the capability it covers.
[[test]]
name = "agent_accounts_fixtures"
required-features = ["bridge"]

[[test]]
name = "contract_fixtures"
required-features = ["inference"]

[[test]]
name = "event_proof_compat"
required-features = ["chain"]

[[test]]
name = "governance_receipt"
required-features = ["chain"]

[[test]]
name = "payment_credentials"
required-features = ["payments"]

[[test]]
name = "settle_fixtures"
required-features = ["settlement"]

[[test]]
name = "web_payments"
required-features = ["payments"]

[[test]]
name = "nft_fixtures"
required-features = ["chain"]

# The binding tests drive the client of every capability.
[[test]]
name = "bindings_chain"
required-features = ["full"]

[[test]]
name = "bindings_identity_payments"
required-features = ["full"]

[[test]]
name = "bindings_inference"
required-features = ["full"]
