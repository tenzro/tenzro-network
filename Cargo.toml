[workspace]
resolver = "2"
members = [
  "crates/tenzro-types",
  "crates/tenzro-onboarding-types",
  "crates/tenzro-update-notice",
  "crates/tenzro-crypto",
  "crates/tenzro-secure-enclave",
    "crates/tenzro-tee",
  "crates/tenzro-zk",
  "crates/tenzro-network",
  "crates/tenzro-storage",
  "crates/tenzro-wallet",
  "crates/tenzro-keystore-unlock",
  "crates/tenzro-keygen",
  "crates/tenzro-catalog",
  "crates/tenzro-device-key",
  "sdk/tenzro-ts-sdk/native",
  "sdk/tenzro-py/native",
  "crates/tenzro-consensus",
  "crates/tenzro-vm",
  "crates/tenzro-token",
  "crates/tenzro-model",
  "crates/tenzro-settlement",
  "crates/tenzro-settlement-fuzz",
  "crates/tenzro-bridge",
  "crates/tenzro-identity",
  "crates/tenzro-payments",
  "crates/tenzro-auth",
  "crates/tenzro-events",
  "crates/tenzro-iroh",
  "crates/tenzro-cluster",
  "crates/tenzro-storage-provider",
  "crates/tenzro-trust",
  "crates/tenzro-node",
  "crates/tenzro-cli",
  "crates/tenzro-cert-stark",
  "crates/tenzro-finality",
  "crates/tenzro-sim",
  "crates/tenzro-econsim",
  "crates/tenzro-openshell",
]
exclude = [
  # The finality prover and its zkVM guest: their own workspace, built only
  # where proofs are made.
  "crates/tenzro-finality-prover",
  # Vendored lance-linalg 6.0.0 with its AVX-512 cfg corrected. Wired via
  # [patch.crates-io] at the end of this file.
  "vendor/lance-linalg",
  # Vendored iroh 1.3.0 that opens custom-transport paths on existing
  # connections. Wired via [patch.crates-io] at the end of this file.
  "vendor/iroh",
  # Vendored noq-proto 1.3.0 with the quinn-proto 0.11.19 receive-side fixes. Wired via
  # [patch.crates-io] at the end of this file.
  "vendor/noq-proto",
  # Vendored reed-solomon-erasure 6.0.0 on lru 0.18. Wired via
  # [patch.crates-io] at the end of this file.
  "vendor/reed-solomon-erasure",
  # Vendored esaxx-rs 0.1.10 that leaves the C runtime to the target. Wired via
  # [patch.crates-io] at the end of this file.
  "vendor/esaxx-rs",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tenzro/tenzro-network"
homepage = "https://tenzro.com"
description = "Tenzro Network — AI-Native, Agentic, Tokenized Settlement Layer"
authors = ["Tenzro Network Contributors"]

[workspace.lints.rust]
# The Kani verifier sets `cfg(kani)` when it builds proof harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
# #[async_trait] marks every method it rewrites #[must_use] (a boxed future) and clippy flags the
# result as a second #[must_use]; the attribute is generated by the macro and cannot be edited.
double_must_use = "allow"
# The RPC/web handlers return `Result<T, axum::Response>`, and an
# `axum::http::Response<Body>` is ~128 bytes — over the lint's threshold. Boxing
# it would put an allocation on every error path and churn every call site, to
# save a stack move on a type that is about to be written to a socket anyway.
# Same judgement as `large_enum_variant` above.
result_large_err = "allow"

[workspace.dependencies]
# Workspace crates. Each entry pins `version = "0.1.0"` alongside the
# local path so `cargo publish` resolves to crates.io while in-tree
# builds keep using the local source. Bump versions in lockstep across
# the workspace when cutting a coordinated release.
tenzro-types = { path = "crates/tenzro-types", version = "0.2.0" }
tenzro-onboarding-types = { path = "crates/tenzro-onboarding-types", version = "0.2.0" }
tenzro-update-notice = { path = "crates/tenzro-update-notice", version = "0.2.0" }
tenzro-crypto = { path = "crates/tenzro-crypto", version = "0.2.0" }
tenzro-tee = { path = "crates/tenzro-tee", version = "0.2.0" }
tenzro-zk = { path = "crates/tenzro-zk", version = "0.2.0" }
tenzro-cert-stark = { path = "crates/tenzro-cert-stark", version = "0.2.0", default-features = false }
tenzro-finality = { path = "crates/tenzro-finality", version = "0.2.0" }
tenzro-network = { path = "crates/tenzro-network", version = "0.2.0" }
tenzro-storage = { path = "crates/tenzro-storage", version = "0.2.0" }
tenzro-wallet = { path = "crates/tenzro-wallet", version = "0.2.0" }
tenzro-keystore-unlock = { path = "crates/tenzro-keystore-unlock", version = "0.1.0" }
tenzro-keygen = { path = "crates/tenzro-keygen", version = "0.1.0" }
tenzro-catalog = { path = "crates/tenzro-catalog", version = "0.2.0" }
tenzro-device-key = { path = "crates/tenzro-device-key", version = "0.2.0" }
tenzro-consensus = { path = "crates/tenzro-consensus", version = "0.2.0" }
tenzro-vm = { path = "crates/tenzro-vm", version = "0.2.0" }
tenzro-token = { path = "crates/tenzro-token", version = "0.2.0" }
# Default features off: a member opts into the model engines with
# `features = ["engine"]` (tenzro-node does so through its `inference` feature).
tenzro-model = { path = "crates/tenzro-model", version = "0.2.0", default-features = false }
tenzro-settlement = { path = "crates/tenzro-settlement", version = "0.2.0" }
tenzro-bridge = { path = "crates/tenzro-bridge", version = "0.2.0" }
tenzro-events = { path = "crates/tenzro-events", version = "0.2.0" }
tenzro-iroh = { path = "crates/tenzro-iroh", version = "0.2.0" }
tenzro-cluster = { path = "crates/tenzro-cluster", version = "0.2.0" }
tenzro-storage-provider = { path = "crates/tenzro-storage-provider", version = "0.2.0" }
tenzro-trust = { path = "crates/tenzro-trust", version = "0.2.0" }
tenzro-identity = { path = "crates/tenzro-identity", version = "0.2.0" }
tenzro-payments = { path = "crates/tenzro-payments", version = "0.2.0" }
tenzro-openshell = { path = "crates/tenzro-openshell", version = "0.2.0" }
tenzro-auth = { path = "crates/tenzro-auth", version = "0.2.0" }
tenzro-node = { path = "crates/tenzro-node", version = "0.2.0" }
tenzro-cli = { path = "crates/tenzro-cli", version = "0.2.0" }
tenzro-sdk = { path = "sdk/tenzro-sdk", version = "0.9.0" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"
prost-types = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"

# Cryptography
#
# RustCrypto 0.14 line — Coherent Set A pinned to exact RC versions.
# k256 0.14.0-rc.12 (2026-06-17) → elliptic-curve =0.14.0-rc.35,
# ecdsa =0.17.0-rc.20, primeorder =0.14.0-rc.12, hash2curve =0.14.0-rc.12.
# Pre-release semver in cargo treats `^0.14.0-rc.X` as matching only the
# same `rc.X` tag, so every elliptic-curve / k256 consumer must agree on
# the same point release. Use exact `=` pins to lock the resolver onto
# the version k256 was built against.
#
# `ff` and `group` are pinned at the stable 0.14.0 release (2026-05-30
# / 2026-06-01) — earlier RC versions were temporarily renamed to
# `rustcrypto-ff` / `rustcrypto-group` on crates.io, then reverted. The
# stable releases are the long-term name.
#
# `sha2 = "0.10"` and `sha3 = "0.10"` stay on the previous major because
# `rsa = "0.9"`, `hkdf = "0.12"`, and a long tail of TLS/attestation/
# integration dependencies bind to `digest = "0.10"` trait API. k256 0.14 /
# p256 0.14 internally consume sha2 0.11 (via `digest = "0.11"`); cargo
# resolves both, but the duplicate is contained in the RustCrypto 0.14-RC
# subgraph and never crosses into application code.
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
k256 = { version = "=0.14.0-rc.12", features = ["ecdsa"] }
elliptic-curve = { version = "=0.14.0-rc.35", features = ["sec1"] }
ecdsa = "=0.17.0-rc.20"
primeorder = "=0.14.0-rc.12"
hash2curve = "=0.14.0-rc.12"
signature = "=3.0.0"
ff = "=0.14.0"
group = "=0.14.0"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
# Verifying Groth16 receipts of the finality guest; no prover, no client.
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std", "disable-dev-mode"] }
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
rand = "0.8"
# Halo2 (PLONKish, inner-product-argument commitments over Pasta): the proof
# system implemented independently of Plonky3 in tenzro-zk.
halo2_proofs = "0.3"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
subtle = "2.6"
curve25519-dalek = { version = "4", features = ["alloc"] }

# Post-quantum signature (NIST FIPS 204)
# ML-DSA-65   — FIPS 204 digital signature, the ML-DSA component of every
#               composite signature
# 0.1.1 is past both the verifier advisory (duplicate hint indices) and the
# decomposition timing advisory.
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
# Second, independent ML-DSA-65 verifier: every ML-DSA signature must be
# accepted by both implementations (see tenzro-crypto pq.rs).
libcrux-ml-dsa = { version = "0.0.11", default-features = false, features = ["mldsa65"] }
# ML-KEM-768 — FIPS 203, the post-quantum half of the consensus channel
# handshake's per-connection key exchange.
ml-kem = { version = "0.3.0-rc.2", features = ["getrandom"] }
# Formally verified ML-KEM-768: the consensus channel KEM uses its results and
# checks every one against ml-kem (see tenzro-consensus kem.rs).
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
getrandom = { version = "0.3", features = ["std"] }

# TLS — pinned at workspace level so we can install aws-lc-rs as the global
# rustls CryptoProvider. aws-lc-rs supports X25519MLKEM768 hybrid named group.
rustls = { version = "0.23.46", default-features = false, features = [
  "std",
  "aws-lc-rs",
  "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws-lc-rs",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "tls12",
  "aws-lc-rs",
  "native-tokio",
] }
aws-lc-rs = { version = "1.16.3", features = ["bindgen"] }

# Networking
prometheus-client = "0.24"

# Storage
rocksdb = "0.22"

# Data availability backends (feature-gated in tenzro-storage)
celestia-rpc = { version = "1.0.0", default-features = false }
celestia-types = "1.0.0"

# Iroh — QUIC-native content-addressed transport (n0-computer, Apache-2.0).
# Used via the new tenzro-iroh crate for blob distribution (model weights,
# outer gradients, sealed shards, DA receipts, agent memory archives) and
# CRDT documents (sealed-dataset manifests, agent template registry).
# iroh 1.3 carries the rustls fix for RUSTSEC-2026-0285. The companion crates below are the
# releases built against iroh 1.x — keep them in lockstep when upgrading.
# All Apache-2.0.
iroh = "1.3"
iroh-base = "1.3"
iroh-blobs = "0.103.1"
iroh-docs = "0.101"
iroh-gossip = "0.101"
iroh-mdns-address-lookup = "0.6"
irpc = "0.17"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# System
libc = "0.2"
# Router port-mapping probe (UPnP IGD, PCP, NAT-PMP) for `tenzro-node doctor`;
# the same release iroh maps the node's port with. MIT OR Apache-2.0.
portmapper = "0.19"
# Interface addresses, to tell a NATed address from the node's own. MIT.
netdev = "0.46"
# Watchable values and UDP receive metadata for the transport the node adds
# to iroh (crates/tenzro-iroh/src/paths.rs). Apache-2.0 OR MIT.
n0-watcher = "1"
noq-udp = { version = "1.3", default-features = false }
# noq-proto underlies iroh's QUIC transport (see the [patch.crates-io] entry
# below); depended on directly only to reach its concrete congestion
# controllers (crates/tenzro-iroh/src/identity_transport.rs's BBRv3 setup).
noq-proto = { version = "1.3", default-features = false }
rayon = "1.11"

# Compression
zstd = "0.13"

# Reed-Solomon erasure coding for the storage provider (tenzro-storage-provider).
# Systematic RS over GF(2^8): k data shards + m parity shards, any k of n
# reconstruct the object. Pure-Rust, no SIMD intrinsics required.
reed-solomon-erasure = "6"

# Misc
bytes = "1"
url = { version = "2", features = ["serde"] }
hex = "0.4"
bs58 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database. `ResourceWindow.timezone` was stored and serialized
# but never applied — every window was evaluated in UTC, so a CEST schedule ran
# one to two hours off depending on DST. Resolving the zone needs the real
# database; a fixed offset cannot express DST.
chrono-tz = "0.10"
# mmdb reader for territorial licence enforcement (see tenzro-node/src/territory.rs).
#
# Despite the name this reads the mmdb *format*, not MaxMind data specifically —
# the crate is ISC and the data licence is a separate question. Do NOT ship
# MaxMind GeoLite2: its EULA requires deleting superseded databases within 30
# days of a release, which a distributed binary cannot honour, and redistribution
# needs a paid licence. Use DB-IP Lite Country (CC BY 4.0) or sapics/ip-location-db
# `user-country` (PDDL-1.0, public domain) instead.
maxminddb = "0.30"
dashmap = "6"
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"
# The full-screen setup and console (crates/tenzro-cli/src/tui). crossterm comes in through
# ratatui, so the terminal backend is one version; no image, serde or widget extras.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
clap_complete = "4"

# Web server
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
tower = { version = "0.5", features = ["limit"] }
# Server-rendered SVG QR codes for the passkey device-handoff page.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# HTTP client — pinned to rustls + aws-lc-rs so it inherits the PQ-hybrid TLS named group.
# One TLS stack for every HTTPS client: rustls, trusting the platform's root certificates (and SSL_CERT_FILE or
# SSL_CERT_DIR when set). An empty root store refuses every handshake rather than falling back to anything else.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
  "http2",
  "charset",
  "system-proxy",
] }
base64 = "0.22"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# ZK — Plonky3 STARKs (transparent setup). Two proof systems over one statement set:
# KoalaBear + SHA-256 FRI and Goldilocks + BLAKE3 FRI; statements hash with Keccak-f in-circuit.
# Pinned to a single git rev across all p3-* crates because Plonky3 has not tagged a stable 1.x
# and crates.io publishes lag the repo. Rebase as a unit when we move the rev.
# Pin: Plonky3/Plonky3@main 32079474b1d31d9221656ae774afb322d2597db0 (2026-04).
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-sha256 = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-keccak-air = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-lookup = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }

# arkworks BN254 stack — required by tenzro-vm for the EIP-196/197/198 EVM
# precompiles (EC_ADD, EC_MUL, EC_PAIRING). Not used for ZK; Tenzro proofs are
# Plonky3 STARKs over KoalaBear.
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"

# Configuration
toml = "0.8"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# MCP (Model Context Protocol)
rmcp = { version = "3.4.1", features = [
  "server",
  "transport-streamable-http-server",
  "transport-async-rw",
] }
schemars = "1"

# EVM execution
revm = { version = "19", default-features = false, features = [
  "std",
  "serde-json",
] }
rlp = "0.6"
ripemd = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
flate2 = "1"
# Cross-platform advisory file locking (flock on Unix, LockFileEx on Windows)
# behind one API. Already resolved transitively at 0.13.1 (see Cargo.lock) —
# this just exposes it as a direct dependency.
fs4 = { version = "0.13.1", features = ["sync"] }

# SVM execution — Anza solana-svm, gated behind the tenzro-vm `svm-full` feature.
# The processor crates are pinned to an exact 4.1.2 release train; interface
# crates use the exact versions solana-svm 4.1.2 itself depends on. `svm-full`
# opts these in via `dep:` gates; without the feature they are not compiled.
# solana-svm + solana-svm-callback need `agave-unstable-api` for the public
# TransactionBatchProcessor callback surface.
solana-svm = { version = "=4.1.2", features = ["agave-unstable-api"] }
solana-svm-callback = { version = "=4.1.2", features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "=4.1.2" }
solana-program-runtime = { version = "=4.1.2" }
solana-syscalls = { version = "=4.1.2" }
# The whole crate is `#![cfg(feature = "agave-unstable-api")]`; without the
# feature it compiles to nothing and `Entrypoint` does not exist.
solana-bpf-loader-program = { version = "=4.1.2", features = ["agave-unstable-api"] }
solana-system-program = { version = "=4.1.2", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "=4.1.2" }
solana-account = { version = "4.3.0" }
solana-clock = { version = "3.0.1" }
solana-instruction = { version = "3.4.0", features = ["std"] }
solana-message = { version = "4.1.1" }
# `blake3` gates `SanitizedTransaction::try_from_legacy_transaction`.
solana-transaction = { version = "4.1.1", features = ["blake3"] }
solana-pubkey = { version = "4.2.0" }
solana-sdk-ids = { version = "3.1.0" }
solana-fee-structure = { version = "3.0.0" }
solana-hash = { version = "4.3.0" }
solana-rent = { version = "4.2.0" }

# X.509 certificate parsing & signature verification
x509-cert = "0.2"
x509-ocsp = "0.2"
p256 = { version = "=0.14.0-rc.12", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "=0.14.0-rc.12", features = ["ecdsa", "pkcs8", "pem"] }
# RUSTSEC-2023-0071 (Marvin timing sidechannel, potential key recovery) has no
# patched release — every 0.9.x is affected and there is no 0.10.
#
# Reachability assessed 2026-07-31: not exploitable on any production path.
# The advisory needs an attacker to observe timing on a *private-key*
# operation. Every production use here is public-key verification:
#   - `tenzro-tee::attestation` — RSA-PSS verify of attestation payloads
#   - `tenzro-payments::rfc9421` — RSA-PSS / PKCS#1v15 verify, JWKS parsing
# `create_http_signature` is the only signing entry point, and its one
# production caller (`visa_tap::issuer`) is pinned to Ed25519; the
# `sign_rsa_pss` / `sign_rsa_pkcs1v15` arms are reached only from unit tests.
# Re-run this analysis if an RSA *signing* or *decryption* path is ever wired
# to a request handler.
rsa = { version = "0.9", features = ["sha2"] }
der = "0.7"
spki = "0.8"
# signature and ecdsa pinned above with Set A RustCrypto stack.
ciborium = "0.2"

# HuggingFace Hub
hf-hub = { version = "0.4", features = ["tokio"] }

# Praecise Engine (github.com/Praecise/praecise-engine): the batch engine and its
# llama.cpp bindings, a third-party dependency pinned by commit. Upgrading it is
# bumping this one rev (all six crates come from the same commit).
llama-cpp-2 = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
llama-cpp-sys-2 = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
# No features here: without `bundled-llama` praecise-runtime is the engine-free
# part (admission, commitments, KV blob types). tenzro-model's `engine` feature
# turns on `bundled-llama` and `image-gen`.
praecise-runtime = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
praecise-host = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
praecise-diffusion = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
praecise-train = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }
praecise-onnx = { git = "https://github.com/Praecise/praecise-engine", rev = "4feb740dc1fd93712c5d98e2bc55d97b92c090f3" }

ndarray = "0.16"
# Safetensors parsing for MoE per-expert weight blobs and gating networks.
safetensors = "0.8"
# f16 / bf16 → f32 decode for safetensors tensor data.
half = "2"
# Image decoding + resize for vision encoder preprocessing.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }

# JPEG decoding for vision-language embedders: the reference pipelines decode
# with libjpeg-turbo, and its output differs from other decoders by enough to
# move an embedding, so pictures are decoded with the same library (built from
# source).
turbojpeg = { version = "1", default-features = false, features = ["cmake"] }

# HF tokenizers — text-embedding runtime (Qwen3-Embedding, BGE-M3, EmbeddingGemma,
# Snowflake Arctic) and Whisper/Moonshine BPE tokenization. `onig` enables the
# SentencePiece pre-tokenizer used by XLM-R-family models.
tokenizers = { version = "0.20", default-features = false, features = [
  "onig",
  "esaxx_fast",
] }

# Audio decode + resample + FFT for ASR runtime.
# hound: WAV; symphonia: MP3/FLAC/Ogg/MP4-AAC container; rubato: 48k/44.1k→16k
# resample; realfft: real-input FFT for mel-spectrogram.
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "flac",
  "wav",
  "isomp4",
  "ogg",
  "vorbis",
] }
rubato = "0.16"
realfft = "3.4"

tempfile = "3"

futures-util = "0.3"
bitflags = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The edge tier (docs/NODE.md, "Node tiers"): the light build for small,
# embedded and edge devices, built by `scripts/build-tier.sh edge`. Same code
# generation as release; a separate profile so a Raspberry Pi build tuned for
# its processor never shares artifacts with the generic release build.
[profile.edge]
inherits = "release"

# Same optimization level, built to be *built* fast rather than to run fastest.
#
# `release` pins `codegen-units = 1` under thin LTO, which makes the final crate
# a single serial LLVM pass: `tenzro-node` spends ~15 minutes there on a 32-vCPU
# builder with 31 cores idle, and no larger machine shortens it because nothing
# about that pass is parallel. Dependency caching does not help either — the
# workspace crate recompiles on every source change by definition.
#
# Splitting into 16 units and dropping LTO gives that pass back its parallelism.
# The tradeoff is real but narrow here: cross-crate inlining is what is lost, and
# the server nodes this profile exists for spend their time in RPC, gossip and
# routing rather than in a hot numeric loop. The GPU work that would care lives
# in llama.cpp/ggml, compiled by cmake as its own C++ unit and untouched by a
# Rust codegen setting.
#
# Use for server-node deploys; keep `release` for anything latency-critical, and
# for CUDA builds on unified-memory GPU hosts.
[profile.release-deploy]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 0
debug = true

# Dependencies build optimized in dev and test builds; workspace crates stay
# unoptimized for debugging. Unoptimized, a P-256 check takes ~15 times and a
# transfer's execution ~5 times as long, so a test that runs several
# validators in one process cannot keep up with the rates it asserts.
# llama.cpp keeps its unoptimized C++ build, which is slow to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.llama-cpp-sys-2]
opt-level = 0

[patch.crates-io]
# lance-linalg 6.0.0 emits `cfg(kernel_support="avx512")` from three
# independent C builds, and `build_f16_with_flags` returns Ok(()) *without
# compiling anything* when the `fp16kernels` feature is off. The cfg is set,
# the Rust side compiles its AVX-512 branch, and the C definition never
# exists — the link dies on `sum_4bit_dist_table_32bytes_batch_avx512`.
#
# The vendored copy emits the cfg only when all three kernels actually built,
# replaces a `-march=native` that cannot describe an x86_64 target from an
# aarch64 build host, and adds the `rerun-if-changed=build.rs` upstream omits
# (declaring rerun-if-changed narrows the default set, so edits to build.rs
# were silently ignored).
#
# Dropping the cfg costs nothing here: the AVX-512 path is runtime-dispatched
# behind `is_x86_feature_detected!`, and the deployment targets are Broadwell
# Xeons with no AVX-512 at all, so the AVX2 path is what would run regardless.
lance-linalg = { path = "vendor/lance-linalg" }

# noq-proto 1.3.0 (iroh's QUIC state machine) is a fork of quinn-proto and lacks
# the fixes quinn-proto shipped in 0.11.15 to 0.11.19. The vendored copy carries:
#   - the stream reassembly chunk cap (RUSTSEC-2026-0185), checked after every
#     insert including the unordered dedup loop, with compaction past twice the
#     cap (RUSTSEC-2026-0341);
#   - a bound on RETIRE_CONNECTION_ID frames queued for already-retired
#     sequence numbers (RUSTSEC-2026-0339);
#   - the ACK_FREQUENCY max-ack-delay bound that no longer panics when the
#     peer's min_ack_delay exceeds the RTT bound (RUSTSEC-2026-0340);
#   - a fixed per-datagram charge against both datagram buffers, so empty
#     DATAGRAM frames cannot queue without bound (RUSTSEC-2026-0342).
# RUSTSEC-2026-0338 does not apply: noq's assembler dedups through
# ArrayRangeSet, whose insert already ignores empty ranges.
# Drop this override once a noq-proto release includes these fixes.
noq-proto = { path = "vendor/noq-proto" }

# reed-solomon-erasure 6.0.0, the latest release, pins lru 0.7.8, whose
# LruCache::pop is not panic-safe (RUSTSEC-2026-0253, fixed in lru 0.18.2).
# The vendored copy depends on lru 0.18.5; its only change is the NonZeroUsize
# capacity that lru 0.8 and later take (src/core.rs).
# Drop this override once a reed-solomon-erasure release moves past lru 0.7.
reed-solomon-erasure = { path = "vendor/reed-solomon-erasure" }

# iroh 1.3.0 opens paths only to IP addresses holepunching finds and to the
# relay; a path over a custom transport (crates/tenzro-iroh/src/paths.rs) that
# the application names after the connection started on the relay is never
# opened. The vendored copy opens such a path on every connection to that
# remote when it is named (socket/remote_map/remote_state.rs, ResolveRemote).
# It also counts a custom-transport path's round-trip time 10 ms worse than
# an IP path's (socket/biased_rtt_path_selector.rs), since such a path may run
# through a third node. And it queues a path waiting for a free path id once
# (schedule_open_path in remote_state.rs): requeued once per connection on each
# retry, the queue grew exponentially and exhausted the node's memory.
# It also takes a separate TLS provider for endpoint-to-endpoint handshakes
# (Builder::peer_crypto_provider in endpoint.rs), so endpoints can require
# the X25519MLKEM768 hybrid while relay HTTPS keeps X25519 for terminators
# that lack it.
# Drop this override, and this vendored copy, once iroh opens custom paths
# itself, bounds that queue and separates the two providers.
iroh = { path = "vendor/iroh" }

# iroh-gossip 0.101.0's actor waits for room in a peer's send queue
# (src/net.rs, handle_in_event_inner). While it waits it reads no connection,
# so a peer that is itself waiting to send to this node is never read, and
# the two wait on each other for good: the topic goes silent on both, with
# the connections still open. The vendored copy drops a message for a peer
# whose queue is full instead of waiting. Drop this override once iroh-gossip
# stops waiting on a peer's queue.
iroh-gossip = { path = "vendor/iroh-gossip" }

# openh264-sys2 0.9.8 collects its C++ and assembly sources with an unsorted
# directory walk, so the order of the objects it links follows the build
# host's directory order and the x86_64 node binary differed between two
# build hosts. The vendored copy sorts the walk by file name. Drop this
# override once a release sorts its sources.
openh264-sys2 = { path = "vendor/openh264-sys2" }

# esaxx-rs 0.1.10 forces the static C runtime on MSVC, which cannot link with
# llama.cpp and RocksDB (dynamic runtime). The vendored copy leaves the runtime
# to the target. Drop this override once a release stops forcing it.
esaxx-rs = { path = "vendor/esaxx-rs" }


