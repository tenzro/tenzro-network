[workspace]
resolver = "2"
members = [
    "crates/tenzro-types",
    "crates/tenzro-crypto",
    "crates/tenzro-tee",
    "crates/tenzro-zk",
    "crates/tenzro-network",
    "crates/tenzro-storage",
    "crates/tenzro-wallet",
    "crates/tenzro-keystore-unlock",
    "crates/tenzro-device-key",
    "crates/tenzro-consensus",
    "crates/tenzro-vm",
    "crates/tenzro-token",
    "crates/tenzro-agent",
    "crates/tenzro-model",
    "crates/tenzro-settlement",
    "crates/tenzro-bridge",
    "crates/tenzro-identity",
    "crates/tenzro-payments",
    "crates/tenzro-agent-kit",
    "crates/tenzro-auth",
    "crates/tenzro-events",
    "crates/tenzro-workflow",
    "crates/tenzro-cortex",
    "crates/tenzro-training",
    "crates/tenzro-iroh",
    "crates/tenzro-storage-market",
    "crates/tenzro-wasm",
    "crates/tenzro-node",
    "crates/tenzro-cli",
    "tools/genkeys",
]
exclude = [
    # Vendored llama-cpp-rs has its own workspace (members: llama-cpp-2,
    # llama-cpp-sys-2, plus examples/embeddings/server/etc). Exclude the
    # whole directory so cargo doesn't fold its workspace into ours when
    # we patch.crates-io against it. The [patch.crates-io] block at the
    # end of this file is what actually wires the two vendored crates
    # into our build graph as path overrides.
    "vendor/llama-cpp-rs",
    "vendor/llama-cpp-rs/llama-cpp-2",
    "vendor/llama-cpp-rs/llama-cpp-sys-2",
    # Vendored DKLs23 (Set A RustCrypto pins). Wired via [patch.crates-io]
    # at the end of this file.
    "vendor/dkls23-core",
    "vendor/dkls23-secp256k1",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tenzro/tenzro-network"
homepage = "https://tenzro.com"
description = "Tenzro Network — AI-Native, Agentic, Tokenized Settlement Layer"
authors = ["Tenzro Network Contributors"]

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# Workspace crates. Each entry pins `version = "0.1.0"` alongside the
# local path so `cargo publish` resolves to crates.io while in-tree
# builds keep using the local source. Bump versions in lockstep across
# the workspace when cutting a coordinated release.
tenzro-types = { path = "crates/tenzro-types", version = "0.1.1" }
tenzro-crypto = { path = "crates/tenzro-crypto", version = "0.1.0" }
tenzro-tee = { path = "crates/tenzro-tee", version = "0.1.0" }
tenzro-zk = { path = "crates/tenzro-zk", version = "0.1.0" }
tenzro-network = { path = "crates/tenzro-network", version = "0.1.0" }
tenzro-storage = { path = "crates/tenzro-storage", version = "0.1.0" }
tenzro-wallet = { path = "crates/tenzro-wallet", version = "0.1.0" }
tenzro-keystore-unlock = { path = "crates/tenzro-keystore-unlock", version = "0.1.0" }
tenzro-device-key = { path = "crates/tenzro-device-key", version = "0.1.0" }
tenzro-consensus = { path = "crates/tenzro-consensus", version = "0.1.0" }
tenzro-vm = { path = "crates/tenzro-vm", version = "0.1.0" }
tenzro-token = { path = "crates/tenzro-token", version = "0.1.0" }
tenzro-agent = { path = "crates/tenzro-agent", version = "0.1.0" }
tenzro-model = { path = "crates/tenzro-model", version = "0.1.0" }
tenzro-settlement = { path = "crates/tenzro-settlement", version = "0.1.0" }
tenzro-bridge = { path = "crates/tenzro-bridge", version = "0.1.0" }
tenzro-events = { path = "crates/tenzro-events", version = "0.1.0" }
tenzro-cortex = { path = "crates/tenzro-cortex", version = "0.1.0" }
tenzro-training = { path = "crates/tenzro-training", version = "0.1.0" }
tenzro-iroh = { path = "crates/tenzro-iroh", version = "0.1.0" }
tenzro-storage-market = { path = "crates/tenzro-storage-market", version = "0.1.0" }
tenzro-wasm = { path = "crates/tenzro-wasm", version = "0.1.0" }
tenzro-identity = { path = "crates/tenzro-identity", version = "0.1.0" }
tenzro-payments = { path = "crates/tenzro-payments", version = "0.1.0" }
tenzro-agent-kit = { path = "crates/tenzro-agent-kit", version = "0.1.0" }
tenzro-auth = { path = "crates/tenzro-auth", version = "0.1.0" }
tenzro-workflow = { path = "crates/tenzro-workflow", version = "0.1.0" }
tenzro-node = { path = "crates/tenzro-node", version = "0.1.0" }
tenzro-cli = { path = "crates/tenzro-cli", version = "0.1.0" }
tenzro-sdk = { path = "sdk/tenzro-sdk", version = "0.4.13" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"
prost-types = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"

# Cryptography
#
# RustCrypto 0.14 line — Coherent Set A pinned to exact RC versions.
# k256 0.14.0-rc.12 (2026-06-17) → elliptic-curve =0.14.0-rc.35,
# ecdsa =0.17.0-rc.20, primeorder =0.14.0-rc.12, hash2curve =0.14.0-rc.12.
# Pre-release semver in cargo treats `^0.14.0-rc.X` as matching only the
# same `rc.X` tag, so every elliptic-curve / k256 consumer must agree on
# the same point release. Use exact `=` pins to lock the resolver onto
# the version k256 was built against.
#
# `ff` and `group` are pinned at the stable 0.14.0 release (2026-05-30
# / 2026-06-01) — earlier RC versions were temporarily renamed to
# `rustcrypto-ff` / `rustcrypto-group` on crates.io, then reverted. The
# stable releases are the long-term name.
#
# `sha2 = "0.10"` and `sha3 = "0.10"` stay on the previous major because
# `rsa = "0.9"`, `hkdf = "0.12"`, and a long tail of TLS/attestation/
# integration dependencies bind to `digest = "0.10"` trait API. k256 0.14 /
# p256 0.14 internally consume sha2 0.11 (via `digest = "0.11"`); cargo
# resolves both, but the duplicate is contained in the RustCrypto 0.14-RC
# subgraph and never crosses into application code.
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
k256 = { version = "=0.14.0-rc.12", features = ["ecdsa"] }
elliptic-curve = { version = "=0.14.0-rc.35", features = ["sec1"] }
ecdsa = "=0.17.0-rc.20"
primeorder = "=0.14.0-rc.12"
hash2curve = "=0.14.0-rc.12"
signature = "=3.0.0"
ff = "=0.14.0"
group = "=0.14.0"
sha2 = "0.10"
sha3 = "0.10"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
frost-ed25519 = "3"
frost-secp256k1 = "3"
blst = "0.3"
argon2 = "0.5"
subtle = "2.6"
curve25519-dalek = { version = "4", features = ["alloc"] }

# Post-quantum cryptography (NIST FIPS 203/204/205)
# ML-KEM-768  — FIPS 203 key encapsulation, hybrid with X25519
# ML-DSA-65   — FIPS 204 digital signature, hybrid with Ed25519
# SLH-DSA     — FIPS 205 hash-based fallback signature
# CVE GHSA-5x2r-hc65-25f9 (ml-dsa verifier soundness) requires >= 0.1.0-rc.8.
# ml-dsa pulls signature 3.0.0-rc which exposes rand_core 0.10's TryCryptoRng;
# tenzro-crypto adapts a TryRng→OsRng inside `pq` so callers don't see the new traits.
ml-kem = { version = "0.3.0-rc.2", features = ["getrandom"] }
ml-dsa = "0.1.0-rc.11"
slh-dsa = "0.2.0-rc.5"
rand_core = "0.10"
getrandom = { version = "0.3", features = ["std"] }

# TLS — pinned at workspace level so we can install aws-lc-rs as the global
# rustls CryptoProvider. aws-lc-rs supports X25519MLKEM768 hybrid named group.
rustls = { version = "0.23.39", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "aws-lc-rs", "native-tokio"] }
aws-lc-rs = { version = "1.16.3", features = ["bindgen"] }

# Networking — 2026 hardened (closes CVE-2026-33040, CVE-2026-34219, CVE-2024-32984, GHSA-jvgw-gccv-q5p8)
libp2p = { version = "0.56", features = [
    "gossipsub", "kad", "identify", "tls", "yamux",
    "tcp", "quic", "dns", "ping", "relay", "rendezvous",
    "autonat", "dcutr", "request-response", "cbor",
    "mdns", "macros", "tokio", "metrics",
] }
libp2p-metrics = "0.17"
libp2p-connection-limits = "0.6"
libp2p-allow-block-list = "0.6"
prometheus-client = "0.24"
governor = "0.7"
lru = "0.12"

# Storage
rocksdb = "0.22"

# Data availability backends (feature-gated in tenzro-storage)
celestia-rpc = "1.0.0"
celestia-types = "1.0.0"

# Iroh — QUIC-native content-addressed transport (n0-computer, Apache-2.0).
# Used via the new tenzro-iroh crate for blob distribution (model weights,
# outer gradients, sealed shards, DA receipts, agent memory archives) and
# CRDT documents (sealed-dataset manifests, agent template registry).
# Companion crates pin iroh =1.0.0-rc.0 exactly — keep these in lockstep
# when upgrading the RC. All Apache-2.0.
iroh = "=1.0.0-rc.0"
iroh-base = "=1.0.0-rc.0"
iroh-blobs = "0.101"
iroh-docs = "0.99"
iroh-gossip = "0.99"
irpc = "0.15"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# System
libc = "0.2"

# Compression
zstd = "0.13"

# Reed-Solomon erasure coding for the storage market (tenzro-storage-market).
# Systematic RS over GF(2^8): k data shards + m parity shards, any k of n
# reconstruct the object. Pure-Rust, no SIMD intrinsics required.
reed-solomon-erasure = "6"

# CARv1 (Content Addressable aRchive) for portable identity export bundles
# (C.6). We roll a minimal ~40-LOC CARv1 writer directly on top of `cid` +
# `multihash` + `serde_ipld_dagcbor` rather than pulling in the heavier
# `iroh-car` dep (last released Oct 2024). DAG-CBOR is the IPLD codec.
serde_ipld_dagcbor = "0.6"
cid = "0.11"
multihash = "0.19"
multihash-codetable = { version = "0.2", features = ["sha2"] }
unsigned-varint = "0.8"

# Misc
bytes = "1"
url = { version = "2", features = ["serde"] }
hex = "0.4"
bs58 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
dialoguer = "0.11"

# Web server
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tower = { version = "0.5", features = ["limit"] }

# HTTP client — pinned to rustls + aws-lc-rs so it inherits the PQ-hybrid TLS named group.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots", "http2", "charset"] }
base64 = "0.22"
jsonwebtoken = "9"

# ZK — Plonky3 STARKs (transparent setup, KoalaBear field, Poseidon2 hashes).
# Pinned to a single git rev across all p3-* crates because Plonky3 has not tagged a stable 1.x
# and crates.io publishes lag the repo. Rebase as a unit when we move the rev.
# Pin: Plonky3/Plonky3@main 32079474b1d31d9221656ae774afb322d2597db0 (2026-04).
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-keccak-air = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "32079474b1d31d9221656ae774afb322d2597db0" }

# arkworks BN254 stack — required by tenzro-vm for the EIP-196/197/198 EVM
# precompiles (EC_ADD, EC_MUL, EC_PAIRING). Not used for ZK; Tenzro proofs are
# Plonky3 STARKs over KoalaBear.
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"

# Configuration
toml = "0.8"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# MCP (Model Context Protocol)
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "transport-async-rw"] }
schemars = "1"

# EVM execution
revm = { version = "19", default-features = false, features = ["std", "serde-json"] }
rlp = "0.6"
ripemd = "0.1"
solana-sbpf = { version = "0.20", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
flate2 = "1"

# X.509 certificate parsing & signature verification
x509-cert = "0.2"
p256 = { version = "=0.14.0-rc.12", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "=0.14.0-rc.12", features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
der = "0.7"
spki = "0.8"
# signature and ecdsa pinned above with Set A RustCrypto stack.
ciborium = "0.2"

# HuggingFace Hub
hf-hub = { version = "0.4", features = ["tokio"] }

# llama.cpp bindings (replaces candle — proper Metal/CUDA GPU support)
llama-cpp-2 = "0.1.147"

# ONNX Runtime — for non-LLM modalities (timeseries forecasting, vision encoders).
# 2.0 line is the active 2026 standard; auto-downloads the ONNX Runtime binary on
# build via the `download-binaries` feature. CoreML on macOS, CUDA on Linux.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
ndarray = "0.16"
# Image decoding + resize for vision encoder preprocessing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# HF tokenizers — text-embedding runtime (Qwen3-Embedding, BGE-M3, EmbeddingGemma,
# Snowflake Arctic) and Whisper/Moonshine BPE tokenization. `onig` enables the
# SentencePiece pre-tokenizer used by XLM-R-family models.
tokenizers = { version = "0.20", default-features = false, features = ["onig", "esaxx_fast"] }

# Audio decode + resample + FFT for ASR runtime.
# hound: WAV; symphonia: MP3/FLAC/Ogg/MP4-AAC container; rubato: 48k/44.1k→16k
# resample; realfft: real-input FFT for mel-spectrogram.
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "isomp4", "ogg", "vorbis"] }
rubato = "0.16"
realfft = "3.4"

# Video frame extraction shells out to the `ffmpeg` CLI binary (see
# crates/tenzro-model/src/video_runtime.rs). No `ffmpeg-sys-next` linkage —
# the Dockerfile installs `ffmpeg` as a system package. `tempfile` lets us
# hand a path to the CLI without exposing AVIO callbacks for in-memory bytes.
tempfile = "3"

# DKLS23 threshold-ECDSA (t-of-n MPC) bridge signer. Phase D wave 2.
#
# Upstream: 0xCarbon's `dkls23-secp256k1` (Apache-2.0 / MIT,
# repo github.com/0xCarbon/DKLs23). Picked over:
#   - cggmp24 (LFDT-Lockness): alpha, missing refresh + identifiable-abort.
#   - sl-dkls23 (Silence Labs): ToB-audited but non-commercial license only.
# Apache-2.0/MIT and actively maintained; the DKLS23 paper itself is heavily
# audited (no independent audit yet on this specific Rust port).
#
# See crates/tenzro-bridge/src/mpc/ for the implementation. The workspace
# crypto pins above already track the 0.14-rc line required by this crate.
dkls23-secp256k1 = "0.5.1"
dkls23-core = "0.5.1"

# Agent memory tier (Phase B): Lance-backed vector store + Tantivy BM25
# full-text index, hybrid recall via Reciprocal Rank Fusion (k=60). Lives in
# `crates/tenzro-agent/src/memory/`. Lance writes Apache Arrow RecordBatches
# under `{data_dir}/agent_memory/agent_memory_vector.lance`; Tantivy writes
# its inverted index under `{data_dir}/agent_memory/agent_memory_text/`.
lancedb = "0.29"
tantivy = "0.26"
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
futures-util = "0.3"
bitflags = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# Vendored llama-cpp-rs branch with Multi-Token-Prediction speculative
# decoding (`MtpSpeculative` + `LlamaContextType::Mtp`). Upstream PR
# utilityai/llama-cpp-rs#1027 is open and conflicting against main; we
# vendor the fork's branch so the workspace can drive `--spec-type
# draft-mtp` GGUFs in-process via the new safe wrapper. Once upstream
# merges (or ships an equivalent API), drop the patch and bump the
# `llama-cpp-2` constraint above.
[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2" }
llama-cpp-sys-2 = { path = "vendor/llama-cpp-rs/llama-cpp-sys-2" }

# Vendored DKLs23 at 0.5.1 with deps bumped to the Set A RustCrypto
# stack (k256 0.14.0-rc.12, elliptic-curve 0.14.0-rc.35, ff 0.14.0,
# group 0.14.0). Source-level rename: `rustcrypto_ff` →  `ff`,
# `rustcrypto_group` → `group` (the upstream RustCrypto crate-rename
# was reverted after 2026-02-02). Drop these patches when DKLs23
# ships 0.5.2 that catches up.
dkls23-core = { path = "vendor/dkls23-core" }
dkls23-secp256k1 = { path = "vendor/dkls23-secp256k1" }

