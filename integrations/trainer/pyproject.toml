[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenzro-trainer"
version = "0.1.0"
description = "Tenzro Train reference trainer (Python). Inner training loops for Decoupled DiLoCo over PyTorch FSDP2 + Hivemind + safetensors. Coordinates with the Rust syncer in tenzro-training over JSON-RPC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenzro" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4.3",
    "numpy>=1.26",
    "requests>=2.31",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
hivemind = ["hivemind>=1.1.10"]
language = [
    "transformers>=4.45",
    "datasets>=2.20",
    "tokenizers>=0.19",
    "peft>=0.13",
    "bitsandbytes>=0.44",
]
vision = ["timm>=1.0", "Pillow>=10.0"]
timeseries = ["pandas>=2.2", "pyarrow>=15.0"]
# FP8 training on Ada/Hopper-class GPUs (compute capability >= 8.9) via
# torchao convert_to_float8_training. flash-attn is intentionally not an
# extra: it needs a CUDA toolchain at install time, so operators install
# it directly on GPU hosts (`pip install flash-attn --no-build-isolation`)
# and the adapter picks it up automatically.
fp8 = ["torchao>=0.7"]
# Confidential-tier shard unwrap (HPKE per RFC 9180 + AES-256-GCM).
# Runs inside the trainer's TEE enclave; never on the syncer side.
confidential = ["pyhpke>=0.5", "cryptography>=42.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
all = ["tenzro-trainer[hivemind,language,vision,timeseries,confidential,fp8]"]

[project.scripts]
tenzro-trainer = "tenzro_trainer.cli:main"
tenzro-trainer-bench = "tenzro_trainer.benchmark:main"

[tool.setuptools.packages.find]
include = ["tenzro_trainer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
