[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenzro-agents"
version = "0.1.0"
description = "Cross-framework Tenzro coordination shims — one core, six thin adapters (LangGraph, CrewAI, Letta, OpenAI Agents SDK, Google ADK, Microsoft Agent Framework). Portable DID identity + AP2 mandates + ERC-8004 reputation beneath any agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenzro" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
# Each adapter's framework is optional; the core imports without any of them.
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
crewai = ["crewai>=0.80"]
letta = ["letta-client>=0.1"]
openai = ["openai-agents>=0.1"]
adk = ["google-adk>=1.0"]
agent-framework = ["agent-framework>=0.1"]
dev = ["pytest>=8.0"]
all = [
    "tenzro-agents[langgraph,crewai,letta,openai,adk,agent-framework]",
]

[project.urls]
Homepage = "https://tenzro.com"
Repository = "https://github.com/tenzro/tenzro-agents"

[tool.setuptools.packages.find]
include = ["tenzro_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
