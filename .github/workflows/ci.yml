name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --workspace --exclude tenzro-desktop --features tenzro-device-key/pq-companion

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Run tests
        run: cargo test --workspace --exclude tenzro-desktop --features tenzro-device-key/pq-companion -- --nocapture

  # Long-running tests, kept out of the default suite so a local `cargo test`
  # stays fast, but run here on every push. They were ignored and unrun for
  # long enough that all five cluster simulations had silently stopped
  # finalising any blocks at all — an ignored test nothing executes is not
  # coverage, it is a comment.
  #
  # Two classes: the consensus cluster simulations (2-3 min), and the model
  # catalog verifiers that resolve every HuggingFace repo + filename (network).
  slow-tests:
    name: Slow and network tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Consensus cluster simulations
        run: cargo test -p tenzro-consensus --test tail_fork_regression -- --ignored --nocapture
      - name: Model catalog resolves on HuggingFace
        run: cargo test -p tenzro-model --lib catalog -- --ignored --nocapture

  benches:
    name: Bench compile-check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Check bench compilation
        run: cargo check --workspace --exclude tenzro-desktop --benches

      # Run benchmarks against the saved `main` baseline (cached via
      # Swatinem/rust-cache@v2's `target/` directory) and fail the build
      # if any benchmark regresses by more than 10%. The baseline is
      # saved on the main branch by a separate cron job; PRs only
      # compare. This catches hot-path regressions before they ship.
      - name: Bench regression gate
        if: github.event_name == 'pull_request'
        run: |
          set -e
          # Only compare if baseline exists in cache.
          if [ -d "target/criterion" ] && find target/criterion -name "base" -type d | grep -q .; then
            cargo bench --workspace --exclude tenzro-desktop -- --baseline main 2>&1 | tee bench-output.txt
            # criterion emits "Performance has regressed" lines when a
            # change exceeds the threshold. Fail the job if any are seen.
            if grep -q "Performance has regressed" bench-output.txt; then
              echo "::error::Bench regression detected — see output above"
              exit 1
            fi
          else
            echo "No baseline cached yet — skipping regression gate"
          fi

      - name: Save bench baseline (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cargo bench --workspace --exclude tenzro-desktop -- --save-baseline main

      # Performance hard-threshold gate. Reads tools/bench-gate/thresholds.toml
      # (each entry pins a public reference bound for the target) and fails the
      # build if any bench exceeds its ceiling or falls below its floor. Runs on
      # every PR so regressions caught here are absolute, not relative.
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          python-version: '3.11'
      - name: Run criterion suite for performance gate
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        run: cargo bench --workspace --exclude tenzro-desktop -- --warm-up-time 1 --measurement-time 3
      - name: Performance hard-threshold gate
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        run: python3 tools/bench-gate/gate.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --exclude tenzro-desktop --features tenzro-device-key/pq-companion -- -D warnings

  sdks:
    name: SDKs
    runs-on: ubuntu-latest
    # The Rust and TypeScript SDKs are standalone workspaces with their own
    # lockfiles, because each ships as its own published package. That means
    # `cargo check --workspace` from the repo root does not reach them, and
    # `-p tenzro-sdk` resolves to nothing at all — a check against them from
    # the root can look like it passed while compiling none of their code.
    #
    # They depend on tenzro-types, so a change there breaks them silently.
    # This job is the thing that makes that break visible.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust SDK — format
        working-directory: sdk/tenzro-sdk
        run: cargo fmt --all -- --check
      - name: Rust SDK — clippy
        working-directory: sdk/tenzro-sdk
        run: cargo clippy --lib -- -D warnings
      - name: Rust SDK — test
        working-directory: sdk/tenzro-sdk
        run: cargo test --lib
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript SDK — install
        working-directory: sdk/tenzro-ts-sdk
        run: npm ci || npm install
      - name: TypeScript SDK — typecheck
        working-directory: sdk/tenzro-ts-sdk
        run: npx tsc --noEmit -p tsconfig.json
      # Both of the checks below exist because the two most recent publish
      # blockers were findable only by attempting a publish, and would have
      # shipped broken packages.
      #
      # `cargo publish --dry-run` packages the crate the way the registry
      # will. That matters because cargo selects files via the VCS, and
      # `sdk/` is gitignored in the monorepo — so a newly added module was
      # silently omitted from the tarball while compiling fine in place.
      - name: Rust SDK — publish dry-run (catches files missing from the tarball)
        working-directory: sdk/tenzro-sdk
        run: cargo publish --dry-run
      # A clean checkout has no node_modules, so it resolves the newest
      # TypeScript rather than the pinned one. That is what a publish does,
      # and it is how a TS-7-only type error reached the registry gate
      # unnoticed. Run it explicitly rather than waiting to find out.
      - name: TypeScript SDK — typecheck against the newest compiler
        working-directory: sdk/tenzro-ts-sdk
        run: npx -y typescript@latest --noEmit -p tsconfig.json

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
