# Supply-chain gates on every push and pull request, and weekly so a new advisory against an
# unchanged lockfile still fails a run. The tool versions are the pins in
# scripts/testnet/security/tools.env; the policy they enforce is supply-chain/policy.toml and the
# procedure is docs/SUPPLY-CHAIN.md. A guard test (crates/tenzro-types/tests/supply_chain_guard.rs)
# fails when this file stops running a tool or stops pinning an action.
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install the pinned tools
        run: |
          set -euo pipefail
          . scripts/testnet/security/tools.env
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"
      - name: Build pins (one toolchain, --locked, base images, action SHAs)
        run: scripts/supply-chain/check-pins.sh
      - name: cargo deny (advisories, bans, licences, sources)
        run: cargo deny --locked check
      - name: Advisory gate (RustSec, with the recorded exceptions)
        run: scripts/supply-chain/advisory-gate.sh
      - name: cargo vet (every dependency audited or exempted on record)
        run: cargo vet --locked

  git-pin-drift:
    # Advisory only, weekly: compares every git+rev pin in Cargo.toml (the Praecise engine,
    # Plonky3, and any future one) against its upstream default-branch head and opens an issue
    # when something changed. Never fails this workflow and never touches a pin -- a human
    # reviews the diff and bumps it in its own PR (scripts/supply-chain/git-pin-drift.sh).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check every git-pinned dependency for drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(scripts/supply-chain/git-pin-drift.sh 2>&1)
          rc=$?
          echo "$out"
          {
            echo "report<<DRIFT_EOF"
            echo "$out"
            echo "DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
          : "$rc" # 1 = drift found, 2 = check could not run; neither fails this job
      - name: Open an issue if a pin has drifted
        if: contains(steps.drift.outputs.report, 'RESULT: drift found')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "git-pin-drift: a pinned dependency has moved upstream ($(date -u +%Y-%m-%d))" \
            --body "${{ steps.drift.outputs.report }}"
