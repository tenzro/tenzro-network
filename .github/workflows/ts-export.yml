name: Timeseries ONNX Export

# Manual / on-demand. Each run exports one or more target models from
# tools/ts-export/targets.toml and uploads the resulting .onnx files
# as workflow artifacts. A maintainer downloads the artifact and
# uploads it to `tenzro/timeseries-onnx` on HuggingFace — we don't
# auto-publish. This keeps a human in the loop on a reproducibility
# step that affects what real users will run on their nodes.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target ID (from targets.toml) — e.g. "chronos-bolt-small", or "all"'
        required: true
        default: 'chronos-bolt-small'
      opset:
        description: 'ONNX opset version'
        required: false
        default: '17'

  pull_request:
    paths:
      # Run unit tests only — never the heavy export job — when the
      # harness itself changes.
      - 'tools/ts-export/**'
      - '.github/workflows/ts-export.yml'

env:
  PYTHON_VERSION: '3.11'

jobs:
  unit-tests:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pure-Python tests (no torch)
        working-directory: tools/ts-export
        run: python -m unittest test_targets.py -v

  export:
    name: Export ${{ inputs.target }}
    # Only on workflow_dispatch — heavy step, downloads multi-hundred-MB
    # weights and spends serious CPU on tracing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'tools/ts-export/pyproject.toml'

      - name: Install harness
        working-directory: tools/ts-export
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export target(s)
        working-directory: tools/ts-export
        run: |
          set -euxo pipefail
          mkdir -p out

          if [[ "${{ inputs.target }}" == "all" ]]; then
            # Read target ids from the registry without depending on yq/toml-cli.
            TARGETS=$(python -c '
          import export
          for t in export.load_targets():
              print(t)
          ')
          else
            TARGETS="${{ inputs.target }}"
          fi

          for t in $TARGETS; do
            echo "::group::Exporting $t"
            python export.py "$t" --out ./out --opset ${{ inputs.opset }}
            python verify.py "./out/${t}.onnx"
            echo "::endgroup::"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tenzro-ts-onnx-${{ github.run_id }}
          path: tools/ts-export/out/*.onnx
          retention-days: 14
