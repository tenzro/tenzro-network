name: Release macOS

# Builds the macOS release artifacts on GitHub-hosted runners from a given
# commit, for Apple silicon (macos-15) and Intel (macos-15-intel):
#   node        tenzro-node and the CLI, scripts/release/build-macos.sh (Metal
#               on Apple silicon, a CPU build on Intel),
#               then checked on a fresh runner: the archive matches its sha256
#               and the node's startup self-check runs to a clean exit (a
#               refusal is reported, a crash fails the job)
#   device-key  the @tenzro/device-key Node.js binding and the abi3 Python
#               wheel of tenzro-device-key
#   pkg         the unsigned installer package (packaging/macos): repackages the
#               two signed archives named by source_run, refuses any archive whose
#               SHA-256 differs from the one given, installs the package on the
#               runner, checks it, uninstalls it, and uploads the .pkg
# Started by hand; the jobs hold no secrets and only read the repository.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to build (SHA, tag or branch)'
        required: true
        default: 'main'
      build:
        description: 'What to build'
        type: choice
        options: [all, node, device-key, pkg]
        default: all
      source_run:
        description: 'pkg only: run id whose artifacts hold the signed macOS archives'
        required: false
        default: ''
      sha_aarch64:
        description: 'pkg only: SHA-256 of tenzro-node-macos-aarch64-metal.tar.gz in the signed SHA256SUMS'
        required: false
        default: ''
      sha_x86_64:
        description: 'pkg only: SHA-256 of tenzro-node-macos-x86_64-cpu.tar.gz in the signed SHA256SUMS'
        required: false
        default: ''
      pkg_version:
        description: 'pkg only: package version (default: the workspace version)'
        required: false
        default: ''
      public_commit:
        description: 'pkg only: public source commit recorded in the package'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:

  build:
    if: inputs.build == 'all' || inputs.build == 'node'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: tenzro-node-macos-aarch64-metal
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: tenzro-node-macos-x86_64-cpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target ${{ matrix.target }}
          rustc --version
          brew install protobuf
          protoc --version

      - name: Build
        # Hosted runners: arm64 3 cores / 7 GB, Intel 4 cores / 14 GB.
        env:
          CARGO_BUILD_JOBS: 3
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit: $commit"
          scripts/release/build-macos.sh "$commit" "$RUNNER_TEMP/dist"

      - name: Digest and size
        working-directory: ${{ runner.temp }}/dist
        run: |
          shasum -a 256 "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256"
          cat "$ARTIFACT.tar.gz.sha256"
          ls -l "$ARTIFACT.tar.gz"
          tar -tvzf "$ARTIFACT.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ runner.temp }}/dist/${{ env.ARTIFACT }}.tar.gz
            ${{ runner.temp }}/dist/${{ env.ARTIFACT }}.tar.gz.sha256
            ${{ runner.temp }}/dist/${{ env.ARTIFACT }}.buildenv.json
          if-no-files-found: error

  check:
    needs: build
    if: ${{ !cancelled() && (inputs.build == 'all' || inputs.build == 'node') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: tenzro-node-macos-aarch64-metal
          - runner: macos-15-intel
            artifact: tenzro-node-macos-x86_64-cpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist

      - name: Verify digest
        working-directory: dist
        run: shasum -a 256 -c "$ARTIFACT.tar.gz.sha256"

      - name: Self-check
        working-directory: dist
        run: |
          tar -xzf "$ARTIFACT.tar.gz"
          node="$PWD/$ARTIFACT/bin/tenzro-node"
          file "$node" "$ARTIFACT/bin/tenzro"
          ls -l "$node" "$ARTIFACT/bin/tenzro"
          "$node" --version
          "$ARTIFACT/bin/tenzro" --version
          sysctl -n machdep.cpu.brand_string hw.model || true
          data=$(mktemp -d)
          # Exit codes 0 and 1 are a result (started, or refused with a
          # reason); 142 is the alarm that stops a process still running
          # after the given seconds, accepted only where the caller says so;
          # anything else is a crash.
          check() {
            secs=$1 allowed=$2; shift 2
            set +e
            perl -e 'alarm shift; exec @ARGV' "$secs" "$@" > out.log 2>&1
            rc=$?
            set -e
            tail -n 40 out.log
            echo "exit: $rc"
            case " $allowed " in *" $rc "*) ;; *) echo "FAILED: exit $rc"; exit 1 ;; esac
          }
          echo "--- build and accelerators"
          check 60 "0 1" "$node" hardware
          case "$ARTIFACT" in
            *-cpu) grep -qx 'build: CPU' out.log || { echo "FAILED: not a CPU build"; exit 1; } ;;
            *-metal) grep -qx 'build: Metal' out.log || { echo "FAILED: not a Metal build"; exit 1; } ;;
          esac
          # Reading the hardware keys reports and exits: it must never hang,
          # including on a runner VM without a Secure Enclave.
          echo "--- hardware keys (Secure Enclave)"
          check 60 "0 1" "$node" init --data-dir "$data/keys"
          echo "--- startup"
          check 120 "0 1 142" "$node" --data-dir "$data/node" \
            --rpc-addr 127.0.0.1:38545 --web-addr 127.0.0.1:38080 \
            --mcp-addr 127.0.0.1:33001 --a2a-addr 127.0.0.1:33002

      # The install gate's record: written only when every check above passed
      # on this fresh runner; manifest.sh --complete requires it for the archive.
      - name: Install gate record
        working-directory: dist
        run: |
          jq -n --arg artifact "$ARTIFACT" --arg file "$ARTIFACT.tar.gz" \
            --arg sha "$(shasum -a 256 "$ARTIFACT.tar.gz" | cut -d' ' -f1)" \
            --arg role "$(case "$ARTIFACT" in *-metal) echo gpu ;; *) echo cpu ;; esac)" \
            --arg host "Darwin-$(uname -m)" --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{artifact: $artifact, file: $file, sha256: $sha, role: $role, host: $host, verdict: "pass", checked: $checked}' \
            > "$ARTIFACT.install.json"
          cat "$ARTIFACT.install.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}.install
          path: dist/${{ env.ARTIFACT }}.install.json
          if-no-files-found: error

  device-key:
    if: inputs.build == 'all' || inputs.build == 'device-key'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target ${{ matrix.target }}
          rustc --version
          node --version
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet 'maturin>=1.7,<2'

      - name: Build
        env:
          CARGO_BUILD_JOBS: 3
        run: |
          echo "commit: $(git rev-parse HEAD)"
          out="$RUNNER_TEMP/device-key"
          mkdir -p "$out"
          (cd sdk/tenzro-ts-sdk/native && npm run build)
          # The wheel's only non-Python dependency is the Swift runtime, which
          # ships with macOS (/usr/lib/swift), so there is nothing to bundle.
          cp "sdk/tenzro-ts-sdk/native/device-key.$SUFFIX.node" "$out/"
          (cd sdk/tenzro-py/native && "$RUNNER_TEMP/py/bin/maturin" build --release --auditwheel skip --out "$out")
          cd "$out"
          file "device-key.$SUFFIX.node"
          otool -l "device-key.$SUFFIX.node" | grep -A2 LC_RPATH
          otool -l "device-key.$SUFFIX.node" | grep -q 'path /usr/lib/swift ' \
            || { echo "FAILED: no rpath to /usr/lib/swift"; exit 1; }
          # Both bindings must load on a stock Mac.
          node -e "console.log(Object.keys(require('./device-key.$SUFFIX.node')))"
          "$RUNNER_TEMP/py/bin/pip" install --quiet ./tenzro_device_key-*.whl
          "$RUNNER_TEMP/py/bin/python" -c "import tenzro_device_key as m; print(dir(m))"
          shasum -a 256 * | tee SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-key-${{ matrix.suffix }}
          path: ${{ runner.temp }}/device-key/*
          if-no-files-found: error

  pkg:
    if: inputs.build == 'pkg'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SHA_ARM: ${{ inputs.sha_aarch64 }}
      SHA_X86: ${{ inputs.sha_x86_64 }}
      PUBLIC_COMMIT: ${{ inputs.public_commit }}
      TENZRO_VERSION: ${{ inputs.pkg_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the signed archives and check their digests
        run: |
          set -euo pipefail
          [ -n "$SOURCE_RUN" ] && [ -n "$SHA_ARM" ] && [ -n "$SHA_X86" ] || { echo "source_run, sha_aarch64 and sha_x86_64 are required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/in"
          for a in tenzro-node-macos-aarch64-metal tenzro-node-macos-x86_64-cpu; do
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$a" --dir "$RUNNER_TEMP/in"
          done
          cd "$RUNNER_TEMP/in"
          printf '%s  %s\n%s  %s\n' "$SHA_ARM" tenzro-node-macos-aarch64-metal.tar.gz "$SHA_X86" tenzro-node-macos-x86_64-cpu.tar.gz > expected.sha256
          shasum -a 256 -c expected.sha256

      - name: Build the package
        run: |
          set -euo pipefail
          export RELEASE_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          mkdir -p "$RUNNER_TEMP/pkg"
          packaging/macos/build-pkg.sh "$RUNNER_TEMP/in/tenzro-node-macos-aarch64-metal.tar.gz" "$RUNNER_TEMP/in/tenzro-node-macos-x86_64-cpu.tar.gz" "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          shasum -a 256 *.pkg | tee SHA256SUMS.pkg
          ls -l
          pkgutil --check-signature ./*.pkg || true

      - name: Inspect the package (no install)
        working-directory: ${{ runner.temp }}/pkg
        run: |
          pkgutil --payload-files tenzro-*-macos.pkg || true
          mkdir x && pkgutil --expand tenzro-*-macos.pkg x/pkg
          cat x/pkg/Distribution
          ls x/pkg
          for c in x/pkg/*.pkg; do echo "== $c"; ( cd "$c" && gzip -dc Payload | cpio -it 2>/dev/null | sed -n '1,40p' ); ls "$c/Scripts" 2>/dev/null; done

      - name: Install, check, uninstall
        run: packaging/macos/test-pkg.sh "$RUNNER_TEMP"/pkg/tenzro-*-macos.pkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenzro-macos-pkg
          path: |
            ${{ runner.temp }}/pkg/*.pkg
            ${{ runner.temp }}/pkg/SHA256SUMS.pkg
          if-no-files-found: error
