# Cloud Build pipeline for running `cargo test` against the workspace.
#
# This is a *test* pipeline — it does NOT push any image to Artifact Registry
# and does NOT touch the live testnet. It builds the workspace inside the
# same `rust:1.85-slim-bookworm` toolchain the production Dockerfile uses,
# then runs `cargo test` on the targeted crates. Output appears in the
# Cloud Build log; the build exits non-zero on test failure.
#
# Usage:
#
#   gcloud builds submit \
#     --config=cloudbuild-test.yaml \
#     --project=<your-gcp-project> \
#     --machine-type=n1-highcpu-32 \
#     --disk-size=200 \
#     --timeout=3600s \
#     .
#
# Cost: ~$1-2 per run on n1-highcpu-32 (~20 min). Free local disk needed: 0
# beyond the source upload (.gcloudignore excludes apps/, target/, node_modules/).

steps:
  # Single-step build + test inside the same Rust container the production
  # image uses. Doing it in one step keeps the workspace + dep cache hot
  # between `cargo check` and `cargo test`.
  - name: 'rust:1.85-slim-bookworm'
    id: 'cargo-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # Same apt deps as the production Dockerfile.
        apt-get update
        apt-get install -y --no-install-recommends \
          pkg-config libssl-dev libclang-dev clang cmake make nasm protobuf-compiler libprotobuf-dev ca-certificates
        rm -rf /var/lib/apt/lists/*

        # llama-cpp-sys-2 requires clang.
        export CC=clang
        export CXX=clang++

        # librocksdb-sys's build script enables -msse4.2 but not -mpclmul, and
        # rocksdb/util/crc32c.cc uses __builtin_ia32_pclmulqdq128 unconditionally.
        # gcc enables pclmul transitively from -msse4.2; clang does not. Add the
        # flag explicitly. x86-64-v3 alone is insufficient — PCLMUL is not part
        # of the x86-64 psABI v2/v3/v4 baselines.
        export CFLAGS="-march=x86-64-v3 -mpclmul"
        export CXXFLAGS="-march=x86-64-v3 -mpclmul"

        # The real apps/tenzro-desktop/Cargo.toml is excluded by .gcloudignore,
        # so generate a stub so the workspace resolves. Mirrors Dockerfile lines 30-44.
        mkdir -p apps/tenzro-desktop/src-tauri/src
        echo 'fn main() {}' > apps/tenzro-desktop/src-tauri/src/main.rs
        echo 'fn main() {}' > apps/tenzro-desktop/src-tauri/build.rs
        printf '%s\n' \
          '[package]' \
          'name = "tenzro-desktop"' \
          'version = "0.1.0"' \
          'edition = "2021"' \
          '' \
          '[build-dependencies]' \
          'tauri-build = { version = "2", features = [] }' \
          > apps/tenzro-desktop/src-tauri/Cargo.toml

        # Workspace check first — fail fast on any compile error before the
        # much-longer test build.
        echo "==== cargo check --workspace ===="
        cargo check --workspace --locked

        # Targeted tests. Order matters: bridge first (smallest + has the
        # Canton/auth code that the recent changes depend on), then node
        # (largest, contains api_key + RPC gate tests).
        echo "==== cargo test -p tenzro-bridge ===="
        cargo test -p tenzro-bridge --locked

        echo "==== cargo test -p tenzro-node --lib ===="
        # --lib avoids integration tests that need a live node/network.
        cargo test -p tenzro-node --lib --locked

        echo "==== ALL TESTS PASSED ===="

# n1-highcpu-32 is the largest non-private-pool option; ~18 min for the
# build alone on this machine, ~20-25 min total with tests.
options:
  machineType: 'N1_HIGHCPU_32'
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

# Build itself can take ~25 min; give 1 hour headroom for cold cargo cache.
timeout: '3600s'
