# cargo-nextest configuration.
#
# The only thing here is scheduling: some tests measure wall-clock behaviour
# and cannot share a machine with each other.

[test-groups]
# Tests that assert on how much happens inside a fixed wall-clock window
# starve each other when run concurrently: they pass individually and fail in
# a batch, the shape of a timing test that is really measuring load.
# Serialising them is the fix rather than loosening their thresholds.
cluster-simulations = { max-threads = 1 }

# Every wall-clock-sensitive test shares this one group: any heavy neighbour
# can starve one, so the group has to cover all of them.
[[profile.default.overrides]]
filter = 'binary(da_committee_load)'
test-group = 'cluster-simulations'
# These are 10-120s each by construction; the default 60s slow-timeout just
# produces noise for tests whose whole purpose is to run for 30 seconds.
slow-timeout = { period = "60s", terminate-after = 5 }
