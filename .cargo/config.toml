[build]
# Use all available CPU cores (omit jobs to use default auto-detection)

# Hardware autodetection strategy:
# - Do NOT set target-cpu=native globally — it breaks llama-cpp-sys-2 on
#   Apple Silicon (Apple Clang rejects -mcpu=native for aarch64).
# - Instead, Rust codegen already targets the host architecture by default.
# - For release builds wanting max SIMD, set RUSTFLAGS per-platform in CI:
#     x86_64: RUSTFLAGS="-C target-cpu=x86-64-v3"  (AVX2, most modern CPUs)
#     ARM64:  (no flag needed — compiler defaults are optimal)
# - GPU acceleration (Metal/CUDA/ROCm/Vulkan) is handled by cargo features.
# - llama.cpp native CPU detection is controlled via CMAKE_ARGS env var.

[env]
# Force GGML_NATIVE=OFF to prevent llama-cpp-sys-2 from passing -mcpu=native
# to Apple Clang. Metal GPU acceleration is unaffected (auto-enabled on macOS).
# On Linux x86_64, AVX2/AVX-512 are still auto-detected by the compiler.
CMAKE_ARGS = "-DGGML_NATIVE=OFF"

# C++ flags for the vendored/`-sys` C++ builds (rocksdb, snappy, zstd).
#
# `-include cstdint` — rocksdb 8.10 (librocksdb-sys 0.16) predates GCC 13's
# stricter libstdc++ headers, which stopped transitively including
# `<cstdint>`. Without it every `uint64_t` / `uint32_t` in
# `db/blob/blob_file_meta.h` and friends fails with "has not been declared",
# and dependent types cascade ("'LinkedSsts' does not name a type"). The
# upstream fix landed in a later rocksdb; forcing the include is the
# minimal equivalent and is a no-op on toolchains that already provide it.
#
# Safe on every target — `<cstdint>` is standard C++ everywhere — so this
# stays in the global `[env]`. The companion x86-only ISA fix is handled by
# advertising `pclmulqdq` in the x86_64 target section below, rather than by
# forcing a `-m` flag here that an aarch64 compiler would reject.
CXXFLAGS = "-include cstdint"

# Spawned-thread stack size, 32 MiB.
#
# Rust gives a spawned thread 2 MiB by default. libtest (and cargo-nextest) run
# each test on a spawned thread, and the `tenzro-node` integration suites
# construct a full `TenzroNode` — storage, RPC, auth engine, the whole subsystem
# graph — which does not fit. Those tests abort with
# `fatal runtime error: stack overflow` rather than failing an assertion, so the
# symptom looks like a crash rather than a test failure.
#
# This is a harness limit, not a product one: in production `TenzroNode::new` is
# reached from `main()` under `#[tokio::main]` and runs on the main thread, which
# gets 8 MiB. Setting this here makes the test environment match the one the code
# actually runs in. cargo-nextest reads `[env]` from this file, so it applies to
# every test process.
RUST_MIN_STACK = "33554432"

[target.x86_64-unknown-linux-gnu]
# x86_64 Linux: enable AVX2 for modern CPUs (Haswell+ / Zen+)
#
# `+pclmulqdq` is not cosmetic. rocksdb's `util/crc32c.cc` compiles
# `__builtin_ia32_pclmulqdq128`, and librocksdb-sys only passes the matching
# `-mpclmul` to the C++ compiler when the Rust target-feature list contains
# `pclmulqdq` (its build.rs gates on exactly that). `x86-64-v3` implies
# avx2/sse4.1/sse4.2 but *not* pclmulqdq, so without this the intrinsic is
# compiled with no ISA flag enabling it and the build dies with
# "'__builtin_ia32_pclmulqdq128' needs isa option -mpclmul -msse2".
#
# Declaring it here rather than forcing `-mpclmul` through global CXXFLAGS
# keeps the fix inside the x86 target section (an aarch64 compiler would
# reject the flag) and lets librocksdb-sys's own detection do the work.
# Every x86-64-v3-class CPU has the instruction — it shipped with Westmere.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+pclmulqdq"]

[target.x86_64-unknown-linux-musl]
# x86_64 Linux musl (Alpine/static): same AVX2 baseline
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-unknown-linux-gnu]
# ARM64 Linux (Graviton/Ampere/Docker): compiler defaults are optimal
# No target-cpu override needed — avoids llama-cpp GGML_NATIVE issues
rustflags = []

[target.aarch64-apple-darwin]
# Apple Silicon (M1/M2/M3/M4): compiler defaults are optimal
# Metal GPU acceleration auto-enabled by llama-cpp-sys-2 on macOS
# Do NOT set target-cpu=native — breaks llama-cpp cmake build
rustflags = []

[target.x86_64-apple-darwin]
# Intel macOS: enable AVX2 baseline
rustflags = ["-C", "target-cpu=x86-64-v3"]
