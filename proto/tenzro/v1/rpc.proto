syntax = "proto3";
package tenzro.v1;

import "tenzro/v1/types.proto";
import "tenzro/v1/block.proto";
import "tenzro/v1/transaction.proto";
import "tenzro/v1/model.proto";
import "tenzro/v1/settlement.proto";
import "tenzro/v1/agent.proto";
import "tenzro/v1/governance.proto";
import "tenzro/v1/network.proto";
import "tenzro/v1/tee.proto";
import "tenzro/v1/bridge.proto";

// Tenzro Network RPC service
service TenzroRpc {
  // Chain
  rpc GetBlockHeight(GetBlockHeightRequest) returns (GetBlockHeightResponse);
  rpc GetBlock(GetBlockRequest) returns (GetBlockResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc SubmitTransaction(SubmitTransactionRequest) returns (SubmitTransactionResponse);

  // Network
  rpc GetNetworkInfo(GetNetworkInfoRequest) returns (GetNetworkInfoResponse);
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);

  // Wallet
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // Inference
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc RequestInference(InferenceRequest) returns (InferenceResponse);
  rpc GetProviders(GetProvidersRequest) returns (GetProvidersResponse);

  // Settlement
  rpc Settle(SettlementRequest) returns (SettlementReceipt);
  rpc CreateEscrow(CreateEscrowRequest) returns (CreateEscrowResponse);

  // Governance
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc Vote(VoteRequest) returns (VoteResponse);
  rpc CreateProposal(CreateProposalRequest) returns (GovernanceProposal);
}

// Request/Response messages for RPC
message GetBlockHeightRequest {}
message GetBlockHeightResponse { uint64 height = 1; }

message GetBlockRequest { uint64 height = 1; }
message GetBlockResponse { Block block = 1; }

message GetTransactionRequest { Hash tx_hash = 1; }
message GetTransactionResponse { SignedTransaction transaction = 1; }

message SubmitTransactionRequest { Transaction transaction = 1; }
message SubmitTransactionResponse { Hash tx_hash = 1; }

message GetNetworkInfoRequest {}
message GetNetworkInfoResponse { NetworkInfo info = 1; }

message GetNodeInfoRequest {}
message GetNodeInfoResponse { NodeInfo info = 1; }

message HealthRequest {}
message HealthResponse { bool healthy = 1; string version = 2; }

message CreateWalletRequest { string label = 1; }
message CreateWalletResponse { string wallet_id = 1; Address address = 2; }

message GetBalanceRequest { Address address = 1; AssetId asset = 2; }
message GetBalanceResponse { string balance = 1; }

message ListModelsRequest { string filter = 1; }
message ListModelsResponse { repeated ModelInfo models = 1; }

message GetProvidersRequest { string model_id = 1; }
message GetProvidersResponse { repeated InferenceProvider providers = 1; }

message CreateEscrowRequest {
  uint64 amount = 1;
  AssetId asset = 2;
  ReleaseConditions conditions = 3;
  Timestamp timeout = 4;
}
message CreateEscrowResponse { string escrow_id = 1; }

message ListProposalsRequest { string status_filter = 1; }
message ListProposalsResponse { repeated GovernanceProposal proposals = 1; }

message VoteRequest {
  string proposal_id = 1;
  VoteType vote_type = 2;
  string justification = 3;
}
message VoteResponse { string vote_id = 1; }

message CreateProposalRequest {
  string title = 1;
  string description = 2;
  ProposalType proposal_type = 3;
  bytes execution_data = 4;
}
