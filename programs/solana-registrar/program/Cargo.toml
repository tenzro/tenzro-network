[package]
name = "tenzro-svm-registrar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Registers agents in agent_registry_8004 on behalf of a P-256 key verified by the secp256r1 program"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.3"
solana-system-interface = { version = "1", features = ["bincode"] }

# `solana_program::entrypoint!` expands `cfg(feature = "custom-heap")`,
# `cfg(feature = "custom-panic")` and `cfg(target_os = "solana")`; this
# program uses the default heap and panic handler.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("custom-heap", "custom-panic"))',
  'cfg(target_os, values("solana"))',
] }
