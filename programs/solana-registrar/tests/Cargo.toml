[package]
name = "tenzro-svm-registrar-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Runs the registrar program against agent_registry_8004 and Metaplex Core in LiteSVM"

[lib]
path = "src/lib.rs"

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-address = { version = "2.6", features = ["curve25519", "decode"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-message = "4.2"
solana-transaction = { version = "4.1", features = ["serde", "wincode"] }
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-transaction-error = "3.3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
bincode = "1.3"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
curve25519-dalek = "4"
base64 = "0.22"
