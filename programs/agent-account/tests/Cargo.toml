[package]
name = "tenzro-svm-agent-account-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Runs the agent account program in LiteSVM with the secp256r1 program and the shared vectors"

[lib]
path = "src/lib.rs"

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-address = { version = "2.6", features = ["curve25519", "decode"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-message = "4.2"
solana-transaction = { version = "4.1", features = ["serde", "wincode"] }
solana-instruction = "3.4"
solana-transaction-error = "3.3"
solana-account = "4"
solana-clock = "3"
p256 = { version = "0.13", features = ["ecdsa"] }
tenzro-finality-verifier = { path = "../../../contracts/finality-verifier" }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
