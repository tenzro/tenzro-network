# Production genesis.
#
# Validators hold their consensus keys in hardware. Replace `validators = []`
# with one `[[validators]]` entry per founding validator, each printed on its
# own machine by `tenzro-node validator-entry --stake <whole TNZO>`. A node
# refuses to start on a genesis that names no validators. Each founding node
# also adds one `[[role_stakes]]` entry per bonded role it serves, bonding
# from the node account its validator entry names; every founding node bonds
# `rpc` with its seed URL as `endpoint`. Leave `stake` out to bond what the
# governed `stake.*` parameters require at genesis.
version = 1
chain_id = 13380
timestamp = 0
validators = []
accounts = []

# Time rules every validator applies; the genesis state root commits to
# them. A rehearsal network may compress them (shorter epochs, checkpoints and
# lifetimes) to run many epochs quickly.
[time]
checkpoint_interval_ms = 500
epoch_checkpoints = 7200
handover_confirmations = 2
announcement_lifetime_ms = 21600000
compact_interval_ms = 60000
compact_handoff_ms = 90000
leader_slots = 2
calendar_scale = 1
idle_round_interval_ms = 5000

[network_params]
# Starting values of governed network parameters. Each is changed only by an
# enacted governance proposal and applies from the next epoch. A parameter
# not listed starts at its registry value; see docs/GOVERNANCE_PARAMS.md.
# The TNZO/USD rate fees are priced at. 0 (governance) uses fees.tnzo_usd_nano until
# enough independent validators report; their sealed-then-opened reports run
# alongside as a published shadow. 1 (validators) uses the stake-weighted median of
# the opened reports, smoothed and bounded per hourly epoch.
"fees.usd_rate_mode" = 0
# 0.10 USD per TNZO, in nano-USD.
"fees.tnzo_usd_nano" = 100000000
# Rises at most 1% per hour (1.27x a day) and falls at most 5% per hour, so a
# crash is followed within days and a pump is not; only reporters holding two
# thirds of stake can move the rate, and no faster than this.
"fees.usd_rate_max_change_bps" = 100
"fees.usd_rate_max_fall_bps" = 500
# Safety checks (security ratio, stake-backed bridge caps, bond floors) value
# TNZO at the lower of the rate in force and the lowest median of the last day.
"fees.safety_rate_window_epochs" = 24
# Two thirds of bonded stake must open its sealed rates for a median to count.
# 6666, not 6667: with stake split in thirds, an honest two thirds suffices.
"fees.usd_rate_quorum_bps" = 6666
# The rate moves only into the band between the one-third and two-thirds
# stake-weighted quantiles of the opened reports.
"fees.usd_rate_quantile_low_bps" = 3334
"fees.usd_rate_quantile_high_bps" = 6666
"fees.usd_rate_frozen" = 0
# Short of the quorum, a rate more than 3% from the median of the stake that
# still reports (at least a majority) for six hourly epochs in a row moves
# toward that median at the hourly bound: withholding reports freezes the
# rate for six hours at most.
"fees.usd_rate_stale_epochs" = 6
"fees.usd_rate_stale_gap_bps" = 300
"fees.usd_rate_stale_quorum_bps" = 5001
# A validator rate no newer median has set for a day is reported held: fees
# go on at it, and tenzro_getFeeRate answers held = true.
"fees.usd_rate_max_age_epochs" = 24
# Posted USD prices per use, paid in TNZO at the rate in force and burned in full.
# One cent per identity: a Sybil cost far above the chain cost of the record.
"fees.identity_register_micro_usd" = 10000
# A tenth of a cent per proof attestation.
"fees.verify_micro_usd" = 1000
# A hundredth of a cent per inference settlement.
"fees.inference_settle_micro_usd" = 100
# A provider's bond covers 1.1x the TNZO it holds in open escrows.
"compute_bond.var_ratio_bps" = 11000
# Issuance in TNZO (never in fiat): 60M in year 0, 15% less each year, at least
# 10M a year, times a controller multiplier between 0.5x and 1x that moves at
# most 25% of 1x a year: up while slashable stake covers less than
# security.min_ratio_bps of what one attack can take out over the bridges,
# down once it covers more. Issuance never exceeds the base schedule.
"mint.base_tnzo_per_year" = 60000000
"mint.decay_bps_per_year" = 1500
"mint.floor_tnzo_per_year" = 10000000
"mint.adj_bps_per_year" = 2500
"mint.min_mult_bps" = 5000
"mint.max_mult_bps" = 10000
# Validators 45%, providers 40%, apps 15%; providers are paid per settlement
# at most 40% of the fee it paid outside the trade, apps at most 50% of it, so
# a settlement never earns back what it cost.
"mint.validator_share_bps" = 4500
"mint.provider_share_bps" = 4000
"mint.ecosystem_share_bps" = 1500
"mint.revenue_peg_bps" = 10000
"mint.provider_reward_cost_bps" = 4000
# Validators' running cost: 1,500 USD a month each, paid first in stable assets from
# the validator cover reserve (below); the base reward pays what that left, at the rate
# in force, at most 20,000 TNZO a month, funded by up to a quarter of each epoch's burn.
"fees.validator_burn_share_bps" = 2500
"validator.base_cost_usd_month" = 1500
# Validators' running cost is paid first in stable assets, from a reserve filled
# only by the stable settlement fees the treasury keeps, up to 12 months of cost.
"validator.stable_cover_fee_share_bps" = 10000
"validator.stable_cover_target_months" = 12
"validator.base_cap_tnzo_month" = 20000
# A validator claims its running-cost base liquid, before the rest of the claim
# is split into its liquid and vesting parts.
"rewards.base_liquid_bps" = 10000
# 0.1% of settled value = the low end of DEX pool fee tiers (0.05%-0.3%).
"fees.settlement_fee_bps" = 10
# 50% burned, 50% to the treasury = supply sink and funded treasury in equal weight.
"fees.settlement_fee_burn_bps" = 5000
# 50% of the fee paid = a settlement's reward never covers its fee, so wash trading loses.
"fees.activity_reward_fee_bps" = 5000
# 10% of the spend ceiling = lower bound of typical performance bonds.
"agent_bond.spend_bps" = 1000
# Foundation stewardship of the treasury. Steward seats can veto a queued
# treasury or expedited proposal, or hold treasury and expedited enactment for
# at most governance.max_pause_ms; they never spend, propose or set anything.
# After the sunset no steward seat holds power. Governance may move the sunset
# earlier or lower the seat cap; neither can move later or higher.
# 2030-10-01T00:00:00Z. Three steward seats are filled at genesis.
"governance.steward_sunset_ms" = 1917043200000
"governance.steward_max_seats" = 5
# Provider routing standing, out of 10000: a live serving bond holds
# routing.standing_bonded; SLA verdicts over the last
# routing.standing_window_hours closed hours add up to
# routing.standing_availability by the share found available, or
# routing.standing_unjudged_bps of it before any verdict.
"routing.standing_bonded" = 3000
"routing.standing_availability" = 7000
"routing.standing_unjudged_bps" = 5000
"routing.standing_window_hours" = 24
# Base fee floor and ceiling, atto-USD per unit of gas: the floor is the
# marginal cost of a transfer (about 0.0000021 USD for 21,000 gas); the
# ceiling only stops runaway pricing.
"fees.min_base_fee" = 100000000
"fees.max_base_fee" = 1000000000000
"fees.base_fee_change_denominator" = 8
"fees.min_settlement_fee_micro_usd" = 1
# 10% of the treasury's fee revenue goes to the insurance pool.
"fees.insurance_pool_bps" = 1000
# Admission lanes. Fee multiples are of the base fee the next block charges;
# rates are transactions per second per sender (thousandths), bursts in
# transactions. An open (unbonded) key pays 4x and is held to one transaction
# every four seconds, bursts of 10: honest anonymous use is unaffected while
# a funded flood of fresh keys pays four times as much and gets in at a
# quarter of the rate. Above 4x the multiple buys little: the cheapest
# full flood goes through bonded identities.
"admission.open_fee_mult_bps" = 40000
"admission.open_rate_milli" = 250
"admission.open_burst" = 10
"admission.delegated_fee_mult_bps" = 15000
"admission.delegated_rate_milli" = 10000
"admission.delegated_burst" = 100
"admission.verified_fee_mult_bps" = 10000
"admission.verified_rate_milli" = 50000
"admission.verified_burst" = 500
# Staking: 10,000 TNZO validator self-stake; seven days to unbond, longer
# than a vote and its timelock (five days), so stake that votes stays bonded
# until the outcome is enacted.
"stake.validator_tnzo" = 10000
# New validators register only from accounts an enacted ApproveValidators
# proposal approved, until governance sets this to 0. Genesis validators and
# ones already registered are not affected.
"validator.admission_approval" = 1
# A new bond keeps the USD value it has at 0.10 USD per TNZO: below that rate,
# at the safety rate, every stake.* amount rises in proportion for entry.
"stake.bond_floor_rate_nano_usd" = 100000000
"stake.unbonding_ms" = 604800000
"staking.validator_unbonding_ms" = 604800000
# At most 4% of the active set's self-stake finishes exiting in one epoch
# (at least one validator always does).
"staking.exit_churn_bps" = 400
# A validator that signs nothing certified for 5,000 epochs is moved to exit,
# never below the four a launch accepts.
"staking.inactivity_limit_epochs" = 5000
"staking.active_set_floor" = 4
"staking.inactivity_activation_epoch" = 0
# Governance: three days to vote, a third of stake for quorum, two thirds to
# pass, two days of timelock. Stake must be bonded seven days before a
# proposal opens to count on it.
"governance.voting_period_ms" = 259200000
"governance.quorum_bps" = 3334
"governance.threshold_bps" = 6667
"governance.timelock_ms" = 172800000
"governance.min_bond_age_ms" = 604800000
# Any payment out of the treasury or its reserve needs yes votes of three
# quarters of all eligible stake (not of the stake that voted); one of
# 100,000 TNZO or more also waits fourteen days of timelock.
"governance.large_spend_tnzo" = 100000
"governance.large_spend_approval_bps" = 7500
"governance.large_spend_timelock_ms" = 1209600000
# One proposal may at most double a bridge cap, a capture guard or an exit
# limit, or loosen one by as much; tightening is never limited.
"governance.max_cap_raise_bps" = 20000
# Treasury outflow: at most 2% of the balance per proposal and 3% in any
# thirty days. These bound grants and recoveries from the
# treasury; running costs are paid from the running-cost reserve under the
# rules below (docs/ECONOMICS.md, "Treasury policy").
"treasury.max_proposal_outflow_bps" = 200
"treasury.max_period_outflow_bps" = 300
"treasury.outflow_period_ms" = 2592000000
# A change that loosens a capture guard (treasury outflow, the vote's quorum
# and thresholds, issuance, validator pay, slashing, unbonding, the fee
# rate's move cap and quorum) applies ninety days after it enacts.
"governance.guard_loosening_grace_epochs" = 2160
# Running-cost reserve. No amount is fixed: the treasury and the reserve may
# both start empty, and every flow follows from realised fee revenue and
# observed traded volume. At each hourly epoch boundary half of the fee
# revenue the treasury realised moves into the reserve while the reserve is
# under twelve months of observed running cost. Running costs may use 30% of
# the trailing month's (720 epochs') revenue plus 3% of the reserve a month,
# and the reserve sells into the market at most 5% of the TNZO traded in an
# epoch, taking the lowest of the last week of validators' volume reports,
# the newest no older than six epochs. What an
# enacted payment has not been paid within a month lapses.
"treasury.reserve_fill_share_bps" = 5000
"treasury.reserve_target_months" = 12
"treasury.running_cost_revenue_share_bps" = 3000
"treasury.reserve_drawdown_bps" = 300
"treasury.month_epochs" = 720
"treasury.sale_volume_share_bps" = 500
# Whatever volume is reported, the reserve pays out at most 10,000 TNZO an
# epoch.
"treasury.max_sale_tnzo_epoch" = 10000
"treasury.volume_max_age_epochs" = 6
"treasury.volume_window_epochs" = 168
"treasury.payment_ttl_epochs" = 720
# A bridge exit above a quarter of its route's outflow bucket waits 24 hours,
# in which a guardian, or anyone after a proven committee fault, may cancel it.
"bridge.exit_delay_ms" = 86400000
"bridge.exit_delay_threshold_bps" = 2500
# Economic security: a third of bonded stake must cover 1.5 times what one
# attack can take out over the bridges in a day. Raising any outflow cap, or
# switching the fee rate to validator mode, is refused below that.
"security.min_ratio_bps" = 15000
"security.attack_stake_bps" = 3334
"security.attack_window_epochs" = 24
# Caps other than TNZO's shrink each epoch so one epoch lets out at most two
# thirds of bonded stake over 1 + gamma (gamma = 1), at the safety rate. An
# exit over the cap queues for up to a day's worth of the cap.
"bridge.security_gamma_bps" = 10000
"bridge.queue_max_epochs" = 24
# Ready transactions wait at most 10 s on their assigned validator before the
# next in turn may batch them.
"consensus.sender_failover_ms" = 10000
# Optimistic inference audits: at least 5% of answers re-executed elsewhere,
# plus 10 points for each whole TNZO the answer's payment holds.
"inference.optimistic.sample_bps" = 500
"inference.optimistic.sample_escrow_step_gwei" = 1000000000
"inference.optimistic.sample_step_bps" = 1000
# An upheld fault pays 20x the answer's payment (the inverse of the 5% floor
# share, so cheating never pays in expectation), at least 10 cents in TNZO.
"inference.optimistic.penalty_payment_bps" = 200000
"inference.optimistic.penalty_floor_micro_usd" = 100000

