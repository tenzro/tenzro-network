# Guardian seats the network starts with. Protocol guardians pause governance
# enactment, governance guardians veto a queued proposal; either takes
# `governance.guardian_threshold` distinct seated guardians of the role, and a
# pause lifts by itself after `governance.max_pause_ms`. Every seat is a human
# identity and holds a hard term within one year of the genesis time; after
# that only an enacted SetGuardian proposal seats guardians. PLACEHOLDER: the
# genesis set and its terms are set at genesis; a placeholder seat is not
# written, and governance fills it (docs/TOKENOMICS.md, "Tracks").
