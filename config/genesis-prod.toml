# Bridge mint caps bound what a forged delivery can create. Governance raises
# a cap at most doubling it per enacted proposal.
# Most one bridge mint may carry through any route, whole TNZO. Each
# route's own governed limit may be tighter.
bridge_mint_per_mint_tnzo = 10000
# Most one bridge route may mint in one epoch (an hour), whole TNZO.
bridge_mint_per_epoch_tnzo = 25000
# The tighter caps of a route without a light client, whose
# deliveries rest on its committee alone: one mint, and one epoch, whole TNZO
# (a fifth of the light-client caps).
bridge_attested_per_mint_tnzo = 2000
bridge_attested_per_epoch_tnzo = 5000
# The most of each unit that may leave Tenzro over every bridge route
# together in one epoch, in its smallest denomination (TNZO: 18 decimals,
# USDC and OUSD: 6). A unit not named here cannot leave at all until
# governance gives it a cap. Sized from genesis stake, not from expected
# volume: 21 validators of 10,000 TNZO put a third of 210,000 TNZO at risk,
# which at security.min_ratio_bps 1.5 over a day's attack window covers about
# 1,945 TNZO an hour, split equally by USD at 0.10 USD per TNZO: 648 TNZO,
# 64.82 USDC and 64.82 OUSD an hour. A raise is refused until stake secures
# it; the caps other than TNZO's also shrink at once when stake loses value.
bridge_outflow = [
    { unit = "TNZO", per_epoch = "648000000000000000000" },
    { unit = "USDC", per_epoch = "64820000" },
    { unit = "OUSD", per_epoch = "64820000" },
]
# The finality program (RISC Zero image id) whose wrapped proofs the chain
# accepts: the guest as RISC Zero's guest-builder container builds it, which the
# prover embeds; `tenzro-finality-prover image-id` prints the same id anywhere.
finality_program = "578bacf21a7a6a60d75ba661def3099b49231a66f52434b55cc987a18cf6ce39"

# Bridge routes the network starts with. Chain selectors are written as
# strings, since TOML integers stop at 2^63 - 1. Every route below is a
# PLACEHOLDER:
# `placeholders` names the fields still to fill (committee sizes and
# thresholds, contract, pool and ramp addresses, light-client anchors).
# Committee members are never named here or in a proposal: they are drawn on
# chain from the accounts bonded as attestors with a bridge signing key. A
# placeholder route is closed with zero caps and starts disabled; a governance
# vote fills it and another opens it, and opening is refused while any field
# is still a placeholder (docs/BRIDGE.md, "Genesis routes" and "Route modes").
