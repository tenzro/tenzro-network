[package]
name = "tenzro-keygen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A Tenzro node's Ed25519, ML-DSA-65 and X25519 keys, derived on demand from its TPM or Secure Enclave"
documentation = "https://docs.rs/tenzro-keygen"
readme = "README.md"
keywords = ["tenzro", "validator", "keys", "post-quantum"]
categories = ["cryptography"]

[dependencies]
tenzro-crypto = { workspace = true }
tenzro-device-key = { path = "../tenzro-device-key", version = "0.4.0" }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[features]
# Tests only: derive from a fixed software root per data directory. Enabled
# only from dev-dependencies, so it never reaches a release build.
test-keys = ["tenzro-device-key/test-root"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
curve25519-dalek = { workspace = true }
tenzro-device-key = { path = "../tenzro-device-key", version = "0.4.0", features = ["test-root"] }
