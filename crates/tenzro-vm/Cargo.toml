[package]
name = "tenzro-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-VM runtime for Tenzro Network — EVM and SVM execution engines"

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-storage = { workspace = true }
tenzro-tee = { workspace = true }
tenzro-zk = { workspace = true }
tenzro-finality = { workspace = true }
tenzro-settlement = { workspace = true }
tenzro-token = { workspace = true }
# Validator registration verifies the consensus key's proof of possession.
tenzro-consensus = { workspace = true }
# Bridge transfers run the route framework inside block execution.
tenzro-bridge = { workspace = true }
# A catalog fault carries a signed catalog entry, checked as published.
tenzro-trust = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
parking_lot = { workspace = true }
chrono = "0.4"
revm = { workspace = true }
rlp = { workspace = true }
curve25519-dalek = { workspace = true }

# Anza solana-svm stack — compiled only under the `svm-full` feature (see
# `[features]` below). Each is `optional`; the feature turns them on via `dep:`.
solana-svm = { workspace = true, optional = true }
solana-svm-callback = { workspace = true, optional = true }
solana-svm-feature-set = { workspace = true, optional = true }
solana-program-runtime = { workspace = true, optional = true }
solana-syscalls = { workspace = true, optional = true }
solana-bpf-loader-program = { workspace = true, optional = true }
solana-system-program = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-clock = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
solana-message = { workspace = true, optional = true }
solana-transaction = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
solana-sdk-ids = { workspace = true, optional = true }
solana-fee-structure = { workspace = true, optional = true }
solana-hash = { workspace = true, optional = true }
solana-rent = { workspace = true, optional = true }

[features]
# Kani proof harnesses in proofs/, run with `cargo kani -p tenzro-vm --features kani`.
kani = []
# Embed Anza's solana-svm TransactionBatchProcessor for real SBF program
# execution. Off by default: without it the SVM executor's SBF path returns
# VmError::SvmFullFeatureRequired while the SPL Token adapter, cross-VM native
# program, and PDA derivation still work.
svm-full = [
    "dep:solana-svm",
    "dep:solana-svm-callback",
    "dep:solana-svm-feature-set",
    "dep:solana-program-runtime",
    "dep:solana-syscalls",
    "dep:solana-bpf-loader-program",
    "dep:solana-system-program",
    "dep:solana-account",
    "dep:solana-clock",
    "dep:solana-instruction",
    "dep:solana-message",
    "dep:solana-transaction",
    "dep:solana-pubkey",
    "dep:solana-sdk-ids",
    "dep:solana-fee-structure",
    "dep:solana-hash",
    "dep:solana-rent",
]

[dev-dependencies]
criterion = { workspace = true }
# PEM-encodes test TPM endorsement and manufacturer roots for the
# availability-reward and hardware-level tests; no runtime use.
base64 = { workspace = true }
proptest = "1.11"
tenzro-crypto = { workspace = true, features = ["test-keys"] }
tenzro-tee = { workspace = true, features = ["test-ca"] }
# Software consensus keys of every signature scheme for the registration tests.
tenzro-consensus = { workspace = true, features = ["test-keys"] }
tokio = { workspace = true }
rand = { workspace = true }
# getrandom 0.4's SysRng impls rand_core 0.10's TryCryptoRng; wrap in UnwrapErr
# to satisfy the CryptoRng bound on ecdsa 0.17-rc.18 SigningKey::generate_from_rng.
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["std"] }
# Cross-crate consistency: assert wallet's client-side UserOp EIP-712 hash
# matches the EntryPoint's hash byte-for-byte. Dev-only — never compiles
# into the runtime crate. No cycle: tenzro-wallet does not depend on tenzro-vm.
tenzro-wallet = { workspace = true }
# Test-only composite consensus keys for the registration tests.
ml-dsa = { workspace = true }
# Light-client fixtures for the IBC route tests.
tenzro-bridge = { workspace = true, features = ["test-support"] }

[[bench]]
name = "vm_benchmarks"
harness = false

[lints]
workspace = true
