[package]
name = "tenzro-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HotStuff-2 BFT consensus engine for Tenzro Network with TEE-weighted leader selection and equivocation detection"
documentation = "https://docs.rs/tenzro-consensus"
readme = "README.md"
keywords = ["tenzro", "consensus", "hotstuff", "bft", "blockchain"]
categories = ["asynchronous", "cryptography"]

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-storage = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "consensus_benchmarks"
harness = false

[[test]]
name = "tail_fork_regression"
path = "tests/tail_fork_regression.rs"
