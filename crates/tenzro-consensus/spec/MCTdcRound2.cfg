\* MCTdc with two rounds per epoch and one commit before each handover:
\* small enough for TLC to exhaust. MCTdcRound3.cfg goes one round deeper.
CONSTANTS
    v1 = v1
    v2 = v2
    v3 = v3
    v4 = v4
    V = {v1, v2, v3, v4}
    Byz = {v4}
    MaxRound = 2
    LeaderSeq <- MCLeaderSeq
    HaltAfter = 1
    Epochs = 2
    None = None

SPECIFICATION Spec

INVARIANTS
    Agreement
    CertificateUniqueness
    Handover
    BatchAgreement
