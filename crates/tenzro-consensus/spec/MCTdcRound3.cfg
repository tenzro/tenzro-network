\* MCTdc with three rounds per epoch: small enough for TLC to exhaust the
\* state space. MCTdc.cfg explores one round deeper without exhausting it.
CONSTANTS
    v1 = v1
    v2 = v2
    v3 = v3
    v4 = v4
    V = {v1, v2, v3, v4}
    Byz = {v4}
    MaxRound = 3
    LeaderSeq <- MCLeaderSeq
    HaltAfter = 2
    Epochs = 2
    None = None

SPECIFICATION Spec

INVARIANTS
    Agreement
    CertificateUniqueness
    Handover
    BatchAgreement
