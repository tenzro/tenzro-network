[package]
name = "tenzro-device-key"
# Own version (overrides the workspace 0.1.0). 0.3.0 is a BREAKING change: the
# enclave key is now a CryptoKit SEP blob on disk rather than a keychain item,
# so a 0.2.x key is not readable by this version. See src/backend_se.rs.
# 0.4.0 adds the multi-recipient envelope; single-recipient wrapping is gone.
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware-backed device keys for Tenzro — macOS/iOS Secure Enclave P-256 signing + ECIES secret-wrapping, with a biometric KeystoreUnlocker for passkey-gated wallet persistence"
documentation = "https://docs.rs/tenzro-device-key"
readme = "README.md"
keywords = ["tenzro", "secure-enclave", "passkey", "ecies", "keystore"]
categories = ["cryptography", "authentication", "hardware-support"]
build = "build.rs"

[features]
# The Secure Enclave key itself — `create` / `open` / `delete`, signing,
# secret-wrapping, and `SecureEnclaveUnlocker` — needs no asymmetric software
# crypto: the enclave does it. On Apple targets the only build-time requirement
# is a working `swiftc` (Xcode or the Command Line Tools) for the CryptoKit shim.
default = []

# `pq-companion` — the ML-DSA-65 key that rides alongside the enclave P-256
# passkey for hybrid custody. This is the only part of the crate that needs
# `tenzro-crypto`, and pulling it in drags the whole elliptic-curve and
# post-quantum dependency graph along with it. An embedder that only wants a
# device-local enclave key should leave this off.
pq-companion = ["dep:tenzro-crypto"]

[dependencies]
tenzro-keystore-unlock = { path = "../tenzro-keystore-unlock", version = "0.1.0" }
# ML-DSA-65 (FIPS-204) keygen/sign for the post-quantum companion key that
# rides alongside the Secure Enclave P-256 passkey. The seed is sealed at rest
# by ECIES-wrapping it to the SE key (same primitive as `SecureEnclaveUnlocker`).
tenzro-crypto = { path = "../tenzro-crypto", version = "0.2.0", optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
x25519-dalek = { workspace = true }
# HPKE (RFC 9180) is hand-rolled in src/hpke.rs — every Rust HPKE crate models
# the recipient private key as a value, which a non-extractable enclave or TPM
# key cannot be. These are the primitives it is built from.
hkdf = "0.12"
chacha20poly1305 = "0.10"
# NOTE: the workspace pins p256 to "=0.14.0-rc.12". This crate uses 0.13 because
# that is the version the envelope code was built and tested against; the rc
# could not be compiled here without the workspace Cargo.lock. Switching to
# `{ workspace = true }` is a one-line change — do it once you can verify the
# 0.14-rc ECDH API compiles. p256 types do not cross this crate's public API,
# so the duplicate is contained.
p256 = { workspace = true, features = ["ecdh"] }

# `security-framework` is deliberately gone. Persisting a Secure Enclave key
# through it requires the data-protection keychain, which is entitlement-gated;
# the crate now talks to CryptoKit through swift/TenzroSE.swift instead, which
# never touches the keychain at all. See src/backend_se.rs for the measurements.

# TBS (TPM Base Services) access for `backend_tpm`'s hardware Decapsulator —
# same crate/feature set `tenzro-tee`'s TPM signing path uses, for the same
# reason: Windows has no prebuilt tpm2-tools binary to shell out to.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_TpmBaseServices"] }

[lints]
workspace = true
