[package]
name = "tenzro-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tenzro Network full node — ties all subsystems into a running node"

[[bin]]
name = "tenzro-node"
path = "src/main.rs"

[dependencies]
# Advisory flock for the single-instance guard (single_instance.rs).
libc = { workspace = true }
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-tee = { workspace = true }
tenzro-zk = { workspace = true }
tenzro-network = { workspace = true }
tenzro-storage = { workspace = true }
tenzro-wallet = { workspace = true }
tenzro-keystore-unlock = { workspace = true }
tenzro-consensus = { workspace = true }
tenzro-vm = { workspace = true }
tenzro-token = { workspace = true }
tenzro-agent = { workspace = true }
tenzro-identity = { workspace = true }
tenzro-payments = { workspace = true }
tenzro-model = { workspace = true }
llama-cpp-2 = { workspace = true }
tenzro-cortex = { workspace = true }
tenzro-training = { workspace = true }
tenzro-media-gen = { workspace = true }
tenzro-settlement = { workspace = true }
tenzro-storage-provider = { workspace = true }
tenzro-database = { workspace = true }
tenzro-bridge = { workspace = true }
tenzro-events = { workspace = true }
tenzro-agent-kit = { workspace = true }
tenzro-iroh = { workspace = true }
# Machine-class rootfs.ext4 builder (OCI base -> ext4, rootless). Optional: only
# linked when the `machine-builder` feature is on, so the default node build does
# not pull in the builder / archive stack.
tenzro-machine-builder = { workspace = true, optional = true }
# Working directory for the rootfs builder (feature `machine-builder`).
tempfile = { version = "3", optional = true }
tenzro-wasm = { workspace = true, optional = true }
tenzro-auth = { workspace = true }
tenzro-workflow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
qrcode = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libp2p = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
bytes = { workspace = true }
bincode = { workspace = true }
ciborium = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
urlencoding = "2"
tokio-stream = "0.1"
# DNS resolver for the bootstrap-DNS discovery primitive (Fix 2: pkarr-based
# bootstrap peer discovery). hickory-resolver is already a transitive dep
# via iroh; depending on it directly keeps the boot path independent of
# iroh's address-lookup wiring and lets the resolver be invoked before
# the iroh endpoint is bound.
hickory-resolver = "0.26"
async-stream = "0.3"
futures = { workspace = true }
futures-util = "0.3"
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sysinfo = "0.31"
prometheus-client = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
# In-node public HTTPS edge (feature `edge-tls`, src/web/edge_tls.rs). rustls-acme
# 0.15 is on-demand ACME (TLS-ALPN-01) over rustls 0.23 (via futures-rustls 0.26)
# — same rustls major as the workspace, so no duplicate rustls. Its default
# `aws-lc-rs` feature matches the workspace-wide rustls CryptoProvider; `tokio`
# adds the tokio integration. axum-server 0.8 (rustls 0.23 / tokio-rustls 0.26,
# provider supplied by us) serves the axum app over the ACME-driven TLS config.
rustls-acme = { version = "0.15.4", features = ["tokio"], optional = true }
axum-server = { version = "0.8", default-features = false, features = [
  "tls-rustls-no-provider",
], optional = true }
frost-ed25519 = { workspace = true }
frost-secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
hkdf = "0.12"
argon2 = { workspace = true }
zeroize = { workspace = true }
k256 = { workspace = true }
# getrandom 0.4 → SysRng impls rand_core 0.10's TryCryptoRng; wrap in
# UnwrapErr to satisfy the `CryptoRng` bound that k256/p256 0.14-rc's
# `SecretKey::random` requires (signature 3.0.0 → rand_core ^0.10).
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["std"] }
# Managed-database engine backends (see src/db_engines/). Connect-to-existing:
# tokio-postgres + redis are thin clients to operator-run engines; lancedb +
# tantivy + arrow serve the embedded engines in-process under the data dir.
tokio-postgres = { workspace = true }
redis = { workspace = true }
lancedb = { workspace = true }
tantivy = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

[features]
default = [
  "cluster-serving",
  "visa-tap",
  "mastercard-agent-pay",
  "wasi-skills",
  "edge-tls",
]
# In-node public HTTPS edge (src/web/edge_tls.rs). An `edge`-role node terminates
# public TLS itself with rustls and mints Let's Encrypt certificates on demand
# (TLS-ALPN-01), gated to hostnames it is allowed to serve, then hands requests
# to the same axum router as the plain-HTTP Web API. Enabled by default so a
# stock node build can front hosted sites without an external proxy (Caddy/nginx).
edge-tls = ["dep:rustls-acme", "dep:axum-server"]
# LAN layer-pipeline cluster serving. Forwards to tenzro-model, which links
# the ggml RPC backend and builds the rpc-server sidecar used to splice a
# member's layer range into a head node's pipeline. Enabled by default — it
# is core to multi-node serving.
cluster-serving = ["tenzro-model/cluster-serving", "llama-cpp-2/rpc"]
# llama.cpp/ggml LLM backends. Each forwards to tenzro-model, which sets the
# matching GGML_<X> cmake define on the vendored llama-cpp-sys-2 build. A node
# is CPU-only unless one of these is enabled; the runtime reports the compiled
# set via HardwareInfo (compiled_backends / active_backend).
cuda = ["tenzro-model/cuda"]
cuda-no-vmm = ["tenzro-model/cuda-no-vmm"]
rocm = ["tenzro-model/rocm"]
vulkan = ["tenzro-model/vulkan"]
metal = ["tenzro-model/metal"]
sycl = ["tenzro-model/sycl"]
openvino = ["tenzro-model/openvino"]
opencl = ["tenzro-model/opencl"]
musa = ["tenzro-model/musa"]
cann = ["tenzro-model/cann"]
webgpu = ["tenzro-model/webgpu"]
zdnn = ["tenzro-model/zdnn"]
blas = ["tenzro-model/blas"]
# ONNX Runtime GPU execution providers (forecast / vision / text-embedding /
# segmentation / detection / audio runtimes). Forward to tenzro-model.
onnx-cuda = ["tenzro-model/onnx-cuda"]
onnx-tensorrt = ["tenzro-model/onnx-tensorrt"]
onnx-coreml = ["tenzro-model/onnx-coreml"]
visa-tap = ["tenzro-payments/visa-tap"]
mastercard-agent-pay = ["tenzro-payments/mastercard-agent-pay"]
# The sandboxed WASI 0.2 component runtime for marketplace skills and MCP
# tools. Registry admission is permissionless, so a published skill is
# untrusted code: a skill that supplies a content-addressed bundle runs as a
# component with no filesystem, no network and no environment, under a fuel
# budget and an epoch deadline. Enabled by default — without it a bundled
# skill has nowhere safe to run and the node refuses the invocation.
wasi-skills = ["dep:tenzro-wasm"]
# Enable the Firecracker microVM supervisor for `machine`-class app hosting —
# unmodified long-lived server processes run in a hardware-isolated microVM.
# Only meaningful on a Linux node with `/dev/kvm`, root / CAP_NET_ADMIN, and the
# `firecracker` + `jailer` binaries on PATH. Firecracker is driven over its
# unix-socket REST API, so no in-process VMM crate is linked. A node built
# without this feature still holds machine deployment metadata (deploy / list /
# get / remove RPCs work) but never runs a microVM — ingress answers a machine
# request with 501.
firecracker = []
# Enable the machine-class rootfs.ext4 builder: `tenzro_machineDeploy` can accept
# a `build` object (app-context blob + base + run spec), assemble a bootable
# `rootfs.ext4` ROOTLESSLY via e2fsprogs `mke2fs -d`, publish it as an iroh blob,
# and deploy that. Requires e2fsprogs (mke2fs/e2fsck/resize2fs) on the node.
# Without this feature the `build` path returns an honest "not compiled in"
# notice and a prebuilt `artifact_caid` still deploys as before.
machine-builder = ["dep:tenzro-machine-builder", "tenzro-machine-builder/archive", "dep:tempfile"]
# Additionally allow pulling OCI bases by pinned digest from a trusted registry
# at build time (heavier: links oci-client). Without it, bases must be supplied
# as a pre-unpacked directory on the node.
machine-builder-oci = ["machine-builder", "tenzro-machine-builder/oci"]
# Embed Anza's solana-svm for real SBF program execution in the SVM VM. Off by
# default; forwards to tenzro-vm. Without it the SVM SBF path returns
# VmError::SvmFullFeatureRequired.
svm-full = ["tenzro-vm/svm-full"]

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tenzro-auth = { workspace = true }
tenzro-agent-kit = { workspace = true }
tenzro-identity = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
bincode = { workspace = true }

[lints]
workspace = true
