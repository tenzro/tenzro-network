[package]
name = "tenzro-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tenzro Network full node — ties all subsystems into a running node"

[[bin]]
name = "tenzro-node"
path = "src/main.rs"

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-tee = { workspace = true }
tenzro-zk = { workspace = true }
tenzro-network = { workspace = true }
tenzro-storage = { workspace = true }
tenzro-wallet = { workspace = true }
tenzro-consensus = { workspace = true }
tenzro-vm = { workspace = true }
tenzro-token = { workspace = true }
tenzro-agent = { workspace = true }
tenzro-identity = { workspace = true }
tenzro-payments = { workspace = true }
tenzro-model = { workspace = true }
tenzro-cortex = { workspace = true }
tenzro-training = { workspace = true }
tenzro-settlement = { workspace = true }
tenzro-bridge = { workspace = true }
tenzro-events = { workspace = true }
tenzro-agent-kit = { workspace = true }
tenzro-iroh = { workspace = true }
tenzro-auth = { workspace = true }
tenzro-workflow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libp2p = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
bytes = { workspace = true }
bincode = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
futures = { workspace = true }
futures-util = "0.3"
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sysinfo = "0.31"
prometheus-client = { workspace = true }
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
frost-ed25519 = { workspace = true }
frost-secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }

[features]
default = []
cuda = ["tenzro-model/cuda"]
cuda-no-vmm = ["tenzro-model/cuda-no-vmm"]
rocm = ["tenzro-model/rocm"]
vulkan = ["tenzro-model/vulkan"]
metal = ["tenzro-model/metal"]
visa-tap = ["tenzro-payments/visa-tap"]
mastercard-agent-pay = ["tenzro-payments/mastercard-agent-pay"]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tenzro-auth = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
bincode = { workspace = true }
