# Public network genesis.
#
# The network starts from a fresh genesis whose validators hold their
# consensus keys in hardware. Until their entries (printed on each machine by
# `tenzro-node validator-entry --stake <whole TNZO>`) replace
# `validators = []`, a node refuses to start on this genesis.
version = 1
chain_id = 13380
timestamp = 0
validators = []

# Time rules every validator applies; the genesis state root commits to
# them. A rehearsal network may compress them (shorter epochs, checkpoints and
# lifetimes) to run many epochs quickly.
[time]
checkpoint_interval_ms = 500
epoch_checkpoints = 7200
handover_confirmations = 2
announcement_lifetime_ms = 21600000
compact_interval_ms = 60000
compact_handoff_ms = 90000
leader_slots = 2
calendar_scale = 1
idle_round_interval_ms = 5000

# Economy parameters (see genesis-prod.toml).
[network_params]
# Starting values of governed network parameters. Each is changed only by an
# enacted governance proposal and applies from the next epoch. A parameter
# not listed starts at its registry value; see docs/GOVERNANCE_PARAMS.md.
"fees.usd_rate_mode" = 0
"fees.tnzo_usd_nano" = 100000000
"fees.usd_rate_max_change_bps" = 1000
"fees.settlement_fee_bps" = 10
"fees.settlement_fee_burn_bps" = 5000
"fees.activity_reward_fee_bps" = 5000
"agent_bond.spend_bps" = 1000
# Provider routing standing, out of 10000: a live serving bond holds
# routing.standing_bonded; SLA verdicts over the last
# routing.standing_window_hours closed hours add up to
# routing.standing_availability by the share found available, or
# routing.standing_unjudged_bps of it before any verdict.
"routing.standing_bonded" = 3000
"routing.standing_availability" = 7000
"routing.standing_unjudged_bps" = 5000
"routing.standing_window_hours" = 24

