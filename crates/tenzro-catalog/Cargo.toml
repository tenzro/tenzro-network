[package]
name = "tenzro-catalog"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Tenzro model catalog: signed, published model entries loaded at runtime, with each model's licence, engine, footprint and the hash of every file it downloads"
documentation = "https://docs.rs/tenzro-catalog"
readme = "README.md"
keywords = ["tenzro", "models", "catalog", "llm", "inference"]
categories = ["data-structures"]

[dependencies]
tenzro-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Tests of crates that read the catalog install the seed entries directly.
test-seed = []

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
