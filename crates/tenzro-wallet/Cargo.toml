[package]
name = "tenzro-wallet"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Permissionless wallet for Tenzro Network — hardware-held key (passkey / TPM / Secure Enclave), ML-DSA-65 + BLS hybrid, Argon2id keystore, transaction history, contacts"
documentation = "https://docs.rs/tenzro-wallet"
readme = "README.md"
keywords = ["tenzro", "wallet", "custody", "secure-enclave", "hardware"]
categories = ["cryptography", "authentication"]

[dependencies]
sha2 = { workspace = true }
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }
argon2 = { workspace = true }
reqwest = { workspace = true }
# Optional transport deps for the PluggableSigner hardware adapters.
# Each adapter is feature-gated; consumers pull the transport only when
# the corresponding feature is enabled.
ledger-transport-hid = { version = "0.11", optional = true }
ledger-apdu = { version = "0.11", optional = true }
hidapi = { version = "2.6", optional = true }
trezor-client = { version = "0.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tenzro-device-key = { path = "../tenzro-device-key", version = "0.4.0", optional = true, features = ["pq-companion"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "process"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "wallet_benchmarks"
harness = false

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"


[features]
# Secure Enclave custody. Off by default: it pulls the CryptoKit shim, which
# needs a Swift toolchain, and only builds on Apple targets.
device-custody-se = ["dep:tenzro-device-key"]
default = []
# Gates the integration test (`tests/e2e_real_rpc.rs`) that runs against a
# locally spawned `tenzro-node` binary. Requires the node binary be built first
# (via `cargo build -p tenzro-node`); enabled with
# `cargo test -p tenzro-wallet --features e2e`.
e2e = []
# Hardware signer adapters. Each pulls in its own transport dependency.
# Off by default so consumers only link what they use.
ledger-signer = ["dep:ledger-transport-hid", "dep:ledger-apdu", "dep:hidapi"]
trezor-signer = ["dep:trezor-client"]
gridplus-signer = []  # reqwest is in main deps already
all-hardware-signers = ["ledger-signer", "trezor-signer", "gridplus-signer"]

[lints]
workspace = true
