[package]
name = "tenzro-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "P2P networking layer for Tenzro Network — libp2p gossipsub, Kademlia DHT, NAT traversal via AutoNAT v2 + Circuit-Relay v2 + DCUtR"
documentation = "https://docs.rs/tenzro-network"
readme = "README.md"
keywords = ["tenzro", "libp2p", "p2p", "gossipsub", "nat-traversal"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-tee = { workspace = true }
libp2p = { workspace = true }
libp2p-metrics = { workspace = true }
libp2p-connection-limits = { workspace = true }
libp2p-allow-block-list = { workspace = true }
prometheus-client = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
hkdf = "0.12"
sha2 = { workspace = true }
parking_lot = { workspace = true }
governor = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
