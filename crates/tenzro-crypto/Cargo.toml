[package]
name = "tenzro-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cryptographic primitives for Tenzro Network"

[dependencies]
tenzro-types = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
# `signature` 3.x is the trait crate implemented by ecdsa 0.17-rc.18.
# ed25519-dalek 2.x still re-exports `signature` 2.x via its public API, so
# the v3 traits must be imported under disambiguating aliases at k256/p256
# call sites (see `signatures.rs`).
signature = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
aes-gcm = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
frost-ed25519 = { workspace = true }
blst = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }

# Post-quantum primitives (NIST FIPS 203/204/205).
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
slh-dsa = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }

# getrandom 0.4 provides `SysRng: TryCryptoRng` over `rand_core 0.10`, which
# is the `CryptoRng` flavour that `ecdsa 0.17-rc.18`'s
# `SigningKey::random(&mut R: CryptoRng + ?Sized)` consumes — that ecdsa pulls
# `signature 3.0.0`, and `signature 3.0.0` pulls `rand_core ^0.10`. Lift via
# `.unwrap_err()` at the call site to get `CryptoRng` from `TryCryptoRng`.
# Renamed for clarity vs the `getrandom = "0.3"` workspace pin (which is the
# one TLS uses).
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["std"] }

[dev-dependencies]
serde_json = "1.0"
criterion = { workspace = true }

[[bench]]
name = "crypto_benchmarks"
harness = false
