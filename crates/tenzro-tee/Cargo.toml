[package]
name = "tenzro-tee"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TEE abstraction layer for Tenzro Network — Intel TDX, AMD SEV-SNP, AWS Nitro"

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
x509-cert = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
# `rsa` 0.9 implements `DecodePublicKey` from spki 0.7, not the 0.8 line pulled
# by ecdsa 0.17-rc.18 / p256-rc.9 / p384-rc.9. Import v0.7 under an alias so
# `RsaPublicKey::from_public_key_der` resolves; the ecdsa call sites continue
# to use the workspace `spki` (0.8).
spki_v07 = { package = "spki", version = "0.7" }
signature = { workspace = true }
# `rsa` 0.9 implements `signature` 2.x traits (not the 3.x line pulled by
# ecdsa 0.17-rc.18). For the RSA-PSS attestation verifier path we import the
# v2 `Verifier` trait explicitly under the alias `signature_v2`.
signature_v2 = { package = "signature", version = "2.2", features = ["std"] }
ecdsa = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
libc = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = "0.12"
sha3 = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["all-tees"]
intel-tdx = ["reqwest"]
amd-sev-snp = ["reqwest"]
aws-nitro = []
nvidia-gpu = ["reqwest"]
# Intel Tiber Trust Authority — hosted attestation verification service that
# returns a signed JWT (EAT profile) after appraising a TDX/SGX/TPM quote.
# Implies `intel-tdx` because Tiber verifies TDX Quotes end-to-end.
intel-tiber = ["intel-tdx", "jsonwebtoken"]
all-tees = ["intel-tdx", "amd-sev-snp", "aws-nitro", "nvidia-gpu", "intel-tiber"]
