[package]
name = "tenzro-tee"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TEE abstraction layer for Tenzro Network — Intel TDX, AMD SEV-SNP, AWS Nitro, NVIDIA GPU, Intel Tiber Trust Authority"
documentation = "https://docs.rs/tenzro-tee"
readme = "README.md"
build = "build.rs"
keywords = ["tenzro", "tee", "intel-tdx", "sev-snp", "attestation"]
categories = ["cryptography", "hardware-support"]

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
x509-cert = { workspace = true }
# OCSP request and response structures (revocation asked of a responder).
x509-ocsp = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
p384 = { workspace = true }
# ECDSA P-521, the curve some TPM vendors' EK roots sign with (x509.rs).
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
# TPM command encoding and the Linux TPM transport (tpm_attest.rs).
tenzro-device-key = { path = "../tenzro-device-key", version = "0.4.0" }
# TPM credential protection: KDFa/KDFe, AES-CFB and the integrity HMAC.
hmac = "0.12"
subtle = { workspace = true }
rsa = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
# `rsa` 0.9 implements `DecodePublicKey` from spki 0.7, not the 0.8 line pulled
# by ecdsa 0.17-rc.18 / p256-rc.9 / p384-rc.9. Import v0.7 under an alias so
# `RsaPublicKey::from_public_key_der` resolves; the ecdsa call sites continue
# to use the workspace `spki` (0.8).
spki_v07 = { package = "spki", version = "0.7" }
signature = { workspace = true }
# `rsa` 0.9 implements `signature` 2.x traits (not the 3.x line pulled by
# ecdsa 0.17-rc.18). For the RSA-PSS attestation verifier path we import the
# v2 `Verifier` trait explicitly under the alias `signature_v2`.
signature_v2 = { package = "signature", version = "2.2", features = ["std"] }
ciborium = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
libc = { workspace = true }
# Intel DCAP quote verification: PCK chain, CRLs, QE identity, TCB info and the
# QE report binding of the attestation key. Ring backend only, no collateral
# client: collateral arrives with the evidence.
dcap-qvl = { version = "0.6.3", default-features = false, features = ["std", "ring", "default-x509"], optional = true }


[features]
default = ["all-tees"]
# A throwaway X.509 certificate authority for other crates' tests. Enabled
# only from [dev-dependencies].
test-ca = ["tenzro-device-key/test-root"]
intel-tdx = ["reqwest", "dep:dcap-qvl"]
amd-sev-snp = ["reqwest"]
aws-nitro = []
nvidia-gpu = ["reqwest"]
# Intel Tiber Trust Authority — hosted attestation verification service that
# returns a signed JWT (EAT profile) after appraising a TDX/SGX/TPM quote.
# Implies `intel-tdx` because Tiber appraises TDX Quotes and needs the TDX
# quote-collection path to produce them.
intel-tiber = ["intel-tdx", "jsonwebtoken"]
all-tees = ["intel-tdx", "amd-sev-snp", "aws-nitro", "nvidia-gpu", "intel-tiber"]

# Secure Enclave = the Apple counterpart to the TPM in the PRIMARY machine
# identity tier. Apple targets only; every other host compiles without it.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tenzro-secure-enclave = { path = "../tenzro-secure-enclave", version = "0.1.0" }

[dev-dependencies]
criterion = { workspace = true }
tenzro-device-key = { path = "../tenzro-device-key", version = "0.4.0", features = ["test-root"] }
tenzro-crypto = { workspace = true, features = ["test-keys"] }

[lints]
workspace = true
