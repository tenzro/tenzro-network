[package]
name = "tenzro-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AI model registry, inference routing, and provider management for Tenzro Network"

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-network = { workspace = true }
tenzro-storage = { workspace = true }
tenzro-cluster = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
bincode = { workspace = true }

# HuggingFace Hub downloads
hf-hub = { workspace = true }

# llama.cpp bindings — GPU-accelerated GGUF inference
# Metal auto-links on macOS ARM64 (no feature flag needed)
# Other backends enabled via feature flags below
llama-cpp-2 = { workspace = true }

# Unicode decoding for llama.cpp token_to_piece
encoding_rs = "0.8"

# ONNX Runtime for non-LLM modalities (timeseries, vision, text-embedding,
# segmentation, detection, audio, video). Always enabled — same posture as
# llama-cpp-2: every node can serve any model in the catalog. Runtime cost
# when no model is loaded is zero (Sessions are per-loaded-model, gated by
# tenzro_load*Model RPCs).
ort = { workspace = true }
ndarray = { workspace = true }
image = { workspace = true }

# MoE expert-host execution: per-expert safetensors weight blobs
# (gate/up/down projections) and gating-network extraction. base64
# carries hidden-state batches on the tenzro/moe wire (f32 LE bytes).
safetensors = { workspace = true }
half = { workspace = true }
base64 = { workspace = true }

# Text-embedding tokenizer (Qwen3, BGE-M3, EmbeddingGemma, Snowflake Arctic)
# and Whisper/Moonshine BPE.
tokenizers = { workspace = true }

# Audio decode + resample + FFT for ASR runtime.
hound = { workspace = true }
symphonia = { workspace = true }
rubato = { workspace = true }
realfft = { workspace = true }

# Video frame extraction shells out to the `ffmpeg` CLI binary.
tempfile = { workspace = true }

# System memory/disk probing for model-load admission control.
sysinfo = "0.31"

# MoE GPU expert-compute backends (optional, pulled only by moe-cuda/moe-wgpu).
# cudarc drives cuBLAS grouped GEMM on NVIDIA; wgpu runs cross-vendor WGSL
# compute (AMD / Apple / Intel). The default build pulls neither.
cudarc = { version = "0.12", optional = true, default-features = false, features = ["cuda-12040", "cublas", "driver"] }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[features]
default = ["cluster-serving"]
# LAN layer-pipeline cluster serving: builds the ggml RPC backend + rpc-server
# binary so a model that exceeds one machine can be served across members on
# the local segment. Enabled by default — it is core to multi-node serving.
cluster-serving = ["llama-cpp-2/rpc"]
# NVIDIA CUDA — datacenter (A100/H100/B200) and consumer (RTX 3090/4090)
cuda = ["llama-cpp-2/cuda"]
# NVIDIA CUDA without virtual memory management (older drivers / embedded)
cuda-no-vmm = ["llama-cpp-2/cuda-no-vmm"]
# AMD ROCm/HIP — datacenter (MI300X/MI325X) and consumer (RX 7900 XTX, Radeon)
rocm = ["llama-cpp-2/rocm"]
# Vulkan — cross-vendor GPU (NVIDIA, AMD, Intel Arc/Battlemage, ARM Mali, Adreno)
vulkan = ["llama-cpp-2/vulkan"]
# Apple Metal — explicit opt-in (auto-linked on macOS ARM64 regardless)
metal = ["llama-cpp-2/metal"]
# Intel oneAPI SYCL — Arc / Battlemage / Data Center GPU Max / integrated Xe.
# Needs the oneAPI DPC++ toolchain (icpx) at build time.
sycl = ["llama-cpp-2/sycl"]
# OpenVINO — runs GGUF on Intel CPU / GPU / NPU. Runtime device via the
# GGML_OPENVINO_DEVICE env var (CPU / GPU / NPU), forwarded by the runtime.
openvino = ["llama-cpp-2/openvino"]
# OpenCL — Qualcomm Adreno, ARM Mali, and other OpenCL 3.0 GPUs.
opencl = ["llama-cpp-2/opencl"]
# Moore Threads MUSA — MTT S-series GPUs.
musa = ["llama-cpp-2/musa"]
# Huawei Ascend CANN — Ascend 910 / 310 NPUs.
cann = ["llama-cpp-2/cann"]
# WebGPU (Dawn) — cross-vendor GPU via the WebGPU API.
webgpu = ["llama-cpp-2/webgpu"]
# BLAS CPU acceleration (OpenBLAS / Intel MKL / Apple Accelerate).
blas = ["llama-cpp-2/blas"]
# IBM Z zDNN — Telum on-chip AI accelerator.
zdnn = ["llama-cpp-2/zdnn"]
# ONNX Runtime GPU execution providers for the non-LLM modalities. The ONNX
# runtimes are always compiled (ort is an unconditional dependency); these
# features additionally link the corresponding execution provider into the
# bundled ONNX Runtime. Session-time provider priority is resolved in
# src/onnx_session.rs (TENZRO_ONNX_EP override; CPU is always the final
# fallback).
onnx-cuda = ["ort/cuda"]
onnx-tensorrt = ["ort/tensorrt"]
onnx-coreml = ["ort/coreml"]
# MoE expert-compute GPU backends for the hand-rolled `ExpertCompute` seam
# (distinct from the llama.cpp GGUF and ONNX EP features above). `moe-gpu` is
# the umbrella that turns on both device probes; `moe-cuda` / `moe-wgpu` pull
# just one. Runtime `ComputeBackend::select()` picks whichever device is
# actually present, always falling back to CPU. Default build pulls none.
moe-gpu = ["moe-cuda", "moe-wgpu"]
moe-cuda = ["dep:cudarc"]
moe-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "model_benchmarks"
harness = false
