[package]
name = "tenzro-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "State storage layer for Tenzro Network — Merkle trees, RocksDB, block storage, snapshots"
documentation = "https://docs.rs/tenzro-storage"
readme = "README.md"
keywords = ["tenzro", "blockchain", "rocksdb", "merkle", "storage"]
categories = ["database", "data-structures"]

[dependencies]
tenzro-types = { workspace = true }
rocksdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
# 2D Reed-Solomon erasure coding for the committee data-availability store
# (`da::redstuff`). Core, not feature-gated.
reed-solomon-erasure = { workspace = true }

# Optional: Celestia DA backend
celestia-rpc = { workspace = true, optional = true }
celestia-types = { workspace = true, optional = true }

# Optional: EigenDA + Avail DA backends — both speak HTTP to a local
# sidecar gateway (`eigenda-proxy` and `avail-light` respectively), so the
# only real new dependency is `reqwest` (Avail additionally uses `base64`
# for payload encoding on the wire).
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
default = []
# Enable the Celestia data-availability backend (`CelestiaBackend`).
# Requires a celestia-node JSON-RPC endpoint and an auth token.
celestia = ["dep:celestia-rpc", "dep:celestia-types"]
# Enable the EigenDA data-availability backend (`EigenDaBackend`).
# Requires a reachable `eigenda-proxy` HTTP gateway.
eigenda = ["dep:reqwest"]
# Enable the Avail data-availability backend (`AvailBackend`).
# Requires a reachable `avail-light` HTTP gateway.
avail = ["dep:reqwest", "dep:base64"]

[dev-dependencies]
tenzro-crypto = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "da_redstuff"
harness = false
