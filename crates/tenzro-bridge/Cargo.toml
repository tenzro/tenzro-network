[package]
name = "tenzro-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-chain bridge adapters for Tenzro Network — LayerZero, Chainlink CCIP, deBridge, Canton, LI.FI aggregator"

[dependencies]
tenzro-types = { workspace = true }
tenzro-token = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-tee = { workspace = true }
tenzro-workflow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
tonic = "0.12"
prost = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.10"
parking_lot = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

# CGGMP24 t-of-n threshold-ECDSA — Phase D bridge signer foundation. The
# vendored glass_pumpkin (at vendor/glass_pumpkin) drops the yanked `core2`
# dep — see workspace-root [patch.crates-io] for the rationale.
cggmp24 = { workspace = true }
cggmp24-keygen = { workspace = true }
round-based = { workspace = true }
generic-ec = { workspace = true }

[dev-dependencies]
tenzro-crypto = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bridge_benchmarks"
harness = false
