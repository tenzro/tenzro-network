[workspace]
members = ["methods"]
resolver = "2"

[package]
name = "tenzro-finality-prover"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Proves Tenzro checkpoint finality as a quantum-safe STARK light clients verify, with an optional Groth16 wrap for EVM chains"
publish = false

[[bin]]
name = "tenzro-finality-prover"
path = "src/main.rs"

[features]
# Prove the STARK on an NVIDIA GPU (a build with it does not wrap).
cuda = ["risc0-zkvm/cuda"]

[dependencies]
tenzro-finality-methods = { path = "methods" }
tenzro-finality = { path = "../tenzro-finality" }
tenzro-zk = { path = "../tenzro-zk" }
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std", "prove", "disable-dev-mode"] }
risc0-groth16 = { version = "3.0.5", default-features = false, features = ["std", "prove"] }
tempfile = "3"
anyhow = "1"
bincode = "1"
hex = "0.4"
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
bincode = "1"
tenzro-types = { path = "../tenzro-types" }
ml-dsa = { version = "0.1.1" }
p256 = { version = "=0.14.0-rc.12", features = ["ecdsa"] }
sha2 = "0.10"
revm = { version = "19.7", default-features = false, features = ["std"] }
sha3 = "0.10"

# risc0-groth16-sys 0.1.0 defines __ADX__ for its CUDA host code on every
# target, so it does not link on aarch64 GPU hosts; the vendored copy defines
# it on x86-64 only.
[patch.crates-io]
risc0-groth16-sys = { path = "vendor/risc0-groth16-sys" }
