[package]
name = "tenzro-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tenzro Decentralized Identity Protocol (TDIP) — unified human and machine identity, W3C DID, delegation scopes, cascading revocation"
documentation = "https://docs.rs/tenzro-identity"
readme = "README.md"
keywords = ["tenzro", "identity", "did", "credentials", "delegation"]
categories = ["cryptography", "authentication"]

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-wallet = { workspace = true }
tenzro-storage = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }

# Chain-derivation layer (stellar/xrpl/EVM address encoding + additive HD
# derivation). Versions reuse the workspace pins.
sha2 = { workspace = true }
sha3 = { workspace = true }
ripemd = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }

# CARv1 + IPLD/DAG-CBOR for portable identity export bundles (C.6).
serde_ipld_dagcbor = { workspace = true }
cid = { workspace = true }
multihash = { workspace = true }
multihash-codetable = { workspace = true }
unsigned-varint = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "identity_benchmarks"
harness = false
