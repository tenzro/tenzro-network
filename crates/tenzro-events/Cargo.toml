[package]
name = "tenzro-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Real-time event streaming, subscriptions, and webhook delivery for Tenzro Network"
documentation = "https://docs.rs/tenzro-events"
readme = "README.md"
keywords = ["tenzro", "events", "streaming", "subscriptions", "webhooks"]
categories = ["asynchronous", "web-programming"]

[dependencies]
tenzro-types = { workspace = true }
tenzro-storage = { workspace = true }
tenzro-crypto = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
parking_lot = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
tonic = "0.12"
prost = { workspace = true }
chrono = { workspace = true }
