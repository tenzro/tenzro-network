[package]
name = "tenzro-trust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Certifications, ratings, operator policies and model provenance for Tenzro Network: signed credentials with revocation, relying-party trust lists, accountable operator policies, content-addressed model manifests with multi-origin agreement, and ingest safety scanning"

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-identity = { workspace = true }
tenzro-storage = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
bs58 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
p256 = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tenzro-crypto = { workspace = true, features = ["test-keys"] }

[lints]
workspace = true
