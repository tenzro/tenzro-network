[package]
name = "tenzro-payments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Payment protocol support for Tenzro Network — MPP, x402, Tempo, Visa TAP, and Mastercard Agent Pay"

[features]
default = ["mpp", "x402", "ap2"]
mpp = []
x402 = []
tempo-bridge = []
visa-tap = []
mastercard-agent-pay = []
ap2 = []

[dependencies]
tenzro-types = { workspace = true }
tenzro-crypto = { workspace = true }
tenzro-identity = { workspace = true }
tenzro-settlement = { workspace = true }
tenzro-bridge = { workspace = true }
tenzro-wallet = { workspace = true }
tenzro-storage = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
ecdsa = { workspace = true }
signature = { workspace = true }
# `rsa` 0.9 implements `signature` 2.x's `Verifier` / `Signer` / `RandomizedSigner`
# traits, not the v3 line pulled by ecdsa 0.17-rc.18. Both versions are needed
# at separate RFC 9421 call sites — the v3 traits come from the workspace
# `signature` pin (above); the v2 traits come from `signature_v2`.
signature_v2 = { package = "signature", version = "2.2", features = ["std"] }
sha2 = { workspace = true }
sha3 = { workspace = true }
hmac = "0.12"
subtle = { workspace = true }
spki = { workspace = true }
rlp = { workspace = true }
rand = { workspace = true }
# getrandom 0.4's SysRng impls rand_core 0.10's TryCryptoRng; wrap in UnwrapErr
# to satisfy the CryptoRng bound on ecdsa 0.17-rc.18 SigningKey::generate_from_rng.
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

[[bench]]
name = "payment_benchmarks"
harness = false

[lints]
workspace = true
