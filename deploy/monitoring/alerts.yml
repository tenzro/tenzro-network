groups:
  - name: tenzro-testnet
    rules:
      - alert: ValidatorDown
        expr: up{job="tenzro-validators"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Validator {{ $labels.instance }} is down"
          description: "Validator has been unreachable for more than 2 minutes"

      - alert: BlockHeightStalled
        expr: increase(tenzro_block_height[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Block production stalled"
          description: "No new blocks produced in the last 5 minutes"

      - alert: HighMemoryUsage
        expr: container_memory_working_set_bytes{namespace="tenzro-testnet"} > 6e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "Memory usage exceeds 6GB"

      - alert: LowPeerCount
        expr: tenzro_peer_count < 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low peer count on {{ $labels.instance }}"
          description: "Node has fewer than 3 peers"

      - alert: FinalityStalled
        expr: tenzro_consensus_last_finalized_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Finality stalled on {{ $labels.instance }}"
          description: "No block has finalized in over a minute while the process is up"

      - alert: FrequentViewTimeouts
        expr: rate(tenzro_consensus_view_timeouts_total[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent view timeouts on {{ $labels.instance }}"
          description: "Views are timing out repeatedly — leader offline, partition, or clock skew"

      - alert: EquivocationDetected
        expr: tenzro_consensus_equivocation_evidence > 0
        labels:
          severity: critical
        annotations:
          summary: "Equivocation evidence recorded on {{ $labels.instance }}"
          description: "A validator double-signed ({{ $labels.kind }}) — slashing evidence has been persisted"
