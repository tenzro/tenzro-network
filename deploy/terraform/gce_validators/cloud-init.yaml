#cloud-config
# Cloud-init for tenzro validator GCE VMs. Substitutions performed by
# Terraform's templatefile() before this is set as instance metadata:
#
#   ${validator_index}      — 0..9
#   ${bootstrap}            — "true" / "false"
#   ${rpc_public}           — "true" / "false"
#   ${registry_host}        — us-central1-docker.pkg.dev
#   ${image_repo}           — tenzro-operator-project/tenzro
#   ${image_tag}            — 20260513-192247 (or newer)
#   ${bootstrap_peer_id}    — 12D3KooW...
#   ${bootstrap_external_ip} — IPv4 of validator-0
#   ${genesis_b64}          — base64-encoded genesis-prod.toml

# No `users:` block — the host doesn't need a named `tenzro` user. The
# tenzro-node container has its own internal `tenzro` user at UID 999, and
# we chown the host data dir to numeric 999:999 so the bind-mount writes
# work. Creating a host `tenzro` user would land it at a different UID
# (200 on COS) and the mount would be unwritable.

write_files:
  - path: /etc/tenzro/genesis.toml
    encoding: b64
    permissions: '0644'
    owner: root:root
    content: ${genesis_b64}

  - path: /var/lib/tenzro-bin/tenzro-fetch-keys
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      # Pull the three validator keys from Secret Manager directly into the
      # data dir under the exact filenames that tenzro-node looks for at
      # startup:
      #
      #   /var/lib/tenzro/validator_key      Ed25519 consensus seed (32 bytes)
      #   /var/lib/tenzro/validator_pq_key   ML-DSA-65 seed         (32 bytes)
      #   /var/lib/tenzro/p2p_key            libp2p Ed25519 seed    (32 bytes)
      #
      # See load_or_generate_validator_keypair / _pq_key in
      # crates/tenzro-node/src/node.rs — same loader that GKE pods use.
      # Idempotent: skips any file that already exists with non-zero size,
      # so a VM rebuild (or restart) never re-fetches.
      # COS has no gcloud CLI; we hit the Secret Manager REST API directly
      # using the VM's metadata-server-issued service account access token.
      set -euo pipefail
      INDEX="${validator_index}"
      DATA_DIR=/var/lib/tenzro
      PROJECT=tenzro-operator-project
      # 999 = the UID of the `tenzro` user inside the tenzro-node container
      # image (see Dockerfile). Bind-mounting /var/lib/tenzro into the
      # container as /data/tenzro only works if the host dir is owned by 999.
      mkdir -p "$DATA_DIR"
      chown 999:999 "$DATA_DIR"
      chmod 0700 "$DATA_DIR"

      TOKEN=$(curl -sS --fail \
        -H 'Metadata-Flavor: Google' \
        'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
        | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')

      declare -A target=(
        [consensus]="$DATA_DIR/validator_key"
        [pq]="$DATA_DIR/validator_pq_key"
        [p2p]="$DATA_DIR/p2p_key"
      )
      for kind in consensus pq p2p; do
        out="$${target[$kind]}"
        if [[ -s "$out" ]]; then
          echo "tenzro-fetch-keys: $kind already present at $out, skipping"
          continue
        fi
        SECRET="tenzro-validator-$INDEX-$kind"
        URL="https://secretmanager.googleapis.com/v1/projects/$PROJECT/secrets/$SECRET/versions/latest:access"
        # Secret Manager returns {"name":..., "payload":{"data":"<base64>"}}.
        # We base64-decode the data field into the raw seed bytes.
        curl -sS --fail \
          -H "Authorization: Bearer $TOKEN" \
          -H 'Accept: application/json' \
          "$URL" \
          | python3 -c 'import sys, json, base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["payload"]["data"]))' \
          > "$out"
        chown 999:999 "$out"
        chmod 0600 "$out"
        echo "tenzro-fetch-keys: wrote $kind to $out ($(wc -c < $out) bytes)"
      done

  - path: /var/lib/tenzro-bin/tenzro-run
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      # Wrapper that systemd execs. Pulls the image fresh on every restart
      # to pick up retags without requiring a VM rebuild, then runs the node
      # under docker with the data directory and keys mounted in.
      set -euo pipefail

      INDEX="${validator_index}"
      BOOTSTRAP="${bootstrap}"
      RPC_PUBLIC="${rpc_public}"
      IMAGE="${registry_host}/${image_repo}/tenzro-node:${image_tag}"
      BOOT_PEER_ID="${bootstrap_peer_id}"
      BOOT_IP="${bootstrap_external_ip}"

      # docker login via docker-credential-gcr (bundled in COS at /usr/bin) —
      # service account has artifactregistry.reader. We deliberately do NOT use
      # gcloud here because COS has no gcloud CLI. /root is read-only on COS,
      # so the docker config goes under /var/lib/tenzro-docker-cfg (writable)
      # and we pass it to every docker invocation via DOCKER_CONFIG.
      export DOCKER_CONFIG=/var/lib/tenzro-docker-cfg
      mkdir -p "$DOCKER_CONFIG"
      /usr/bin/docker-credential-gcr configure-docker --registries="${registry_host}"

      docker pull "$IMAGE"

      # Bind RPC to all interfaces only on the RPC-public node; everywhere
      # else bind to localhost.
      if [[ "$RPC_PUBLIC" == "true" ]]; then
        RPC_BIND=0.0.0.0
      else
        RPC_BIND=127.0.0.1
      fi

      # Note: tenzro-node reads validator_key, validator_pq_key, and p2p_key
      # directly from --data-dir (no CLI flags for those — see
      # load_or_generate_validator_keypair in crates/tenzro-node/src/node.rs).
      # tenzro-fetch-keys.service writes them into /var/lib/tenzro before this
      # service starts.
      # External p2p multiaddr — what Identify advertises to peers. The node
      # hides the raw listen-addr enumeration (which on COS+`--network host`
      # leaks the docker0 bridge 172.17.0.1 and gets peers locked out by
      # their own rate limiters — see crates/tenzro-network/src/behaviour.rs).
      # The terraform module passes the GCE-assigned external IP here so the
      # only address other validators ever see is the routable public one.
      EXTERNAL_P2P_ADDR="/ip4/${external_p2p_ip}/tcp/9000"
      # iroh QUIC sockaddr peers will dial back at. Without this flag,
      # iroh's PkarrPublisher emits a signed-but-empty DNS body (the
      # `presets::Minimal` endpoint can't autodiscover a public address
      # since relay/STUN are disabled, and magicsock only sees the bind
      # socket's `10.0.0.x:9001` private IP). With it, the published Pkarr
      # record carries the routable sockaddr and cross-node iroh fetches
      # resolve cleanly. Matching VPC + host iptables rules opening
      # UDP/9001 are declared in `network.tf` / this file's `runcmd`.
      EXTERNAL_IROH_ADDR="${external_p2p_ip}:9001"

      ARGS=(
        --role validator
        --data-dir /data/tenzro
        --listen-addr /ip4/0.0.0.0/tcp/9000
        --external-p2p-addr "$EXTERNAL_P2P_ADDR"
        --external-iroh-addr "$EXTERNAL_IROH_ADDR"
        --rpc-addr "$RPC_BIND:8545"
        --genesis /config/genesis.toml
        --log-level info
      )

      if [[ "$BOOTSTRAP" != "true" ]]; then
        BOOT_ADDR="/ip4/$BOOT_IP/tcp/9000/p2p/$BOOT_PEER_ID"
        ARGS+=(--boot-nodes "$BOOT_ADDR")
        # NOTE: --state-sync-from is the #129 fast-bootstrap flag, but the
        # image we ship doesn't include it yet. Cold join from genesis works
        # fine for the 10-validator quorum — HotStuff-2 will catch
        # newly-joined validators up via gossip. Re-add the flag here once
        # the #129 binary ships.
      fi

      exec docker run --rm \
        --name tenzro-node \
        --network host \
        -v /var/lib/tenzro:/data/tenzro \
        -v /etc/tenzro:/config:ro \
        -e TENZRO_SIMULATE_SEV=0 \
        -e TENZRO_SIMULATE_TDX=0 \
        -e TENZRO_SIMULATE_NITRO=0 \
        -e TENZRO_SIMULATE_GPU=0 \
        "$IMAGE" \
        "$${ARGS[@]}"

  - path: /etc/systemd/system/tenzro-node.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Tenzro validator node
      After=network-online.target docker.service tenzro-fetch-keys.service
      Wants=network-online.target docker.service
      Requires=tenzro-fetch-keys.service

      [Service]
      Type=simple
      Restart=always
      RestartSec=10
      # SIGTERM → /ready returns 503, drain in-flight requests, exit cleanly.
      # 60s aligns with the graceful_exit() handler timeout in #129.
      TimeoutStopSec=60
      KillSignal=SIGTERM
      ExecStart=/bin/bash /var/lib/tenzro-bin/tenzro-run

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/tenzro-fetch-keys.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Fetch validator keys from Secret Manager
      After=network-online.target
      Wants=network-online.target
      Before=tenzro-node.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/bash /var/lib/tenzro-bin/tenzro-fetch-keys

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Format and mount the attached data disk on first boot.
  - |
    if ! blkid /dev/disk/by-id/google-tenzro-data; then
      mkfs.ext4 -F /dev/disk/by-id/google-tenzro-data
    fi
  - mkdir -p /var/lib/tenzro
  - mount -o discard,defaults /dev/disk/by-id/google-tenzro-data /var/lib/tenzro
  - echo '/dev/disk/by-id/google-tenzro-data /var/lib/tenzro ext4 discard,defaults,nofail 0 2' >> /etc/fstab
  # 999:999 = UID/GID of the `tenzro` user inside the container image. Numeric
  # is required because COS has no host `tenzro` user (and we deliberately
  # don't create one — see comment at the top of write_files).
  - chown -R 999:999 /var/lib/tenzro
  - chmod 0700 /var/lib/tenzro
  # COS ships with iptables INPUT policy=DROP and only allows lo + icmp +
  # tcp:22 + RELATED,ESTABLISHED. Docker `--network host` shares the host
  # network namespace, so the container's listeners on 8545/8080/9000/etc
  # are silently dropped by the host kernel before they reach the
  # container. Open the tenzro-node ports here. Idempotent: -C tests first
  # so cloud-init re-runs (or a manual `cloud-init clean && reboot`) don't
  # duplicate the rule.
  - |
    iptables -C INPUT -p tcp -m multiport --dports 8545,8080,9000,9090,3001:3008 -j ACCEPT 2>/dev/null \
      || iptables -I INPUT 1 -p tcp -m multiport --dports 8545,8080,9000,9090,3001:3008 -j ACCEPT
  # Iroh QUIC endpoint (magicsock) pinned via `TenzroIrohConfig.bind_addr`
  # default `0.0.0.0:9001` — one above libp2p's TCP/9000 so the two stacks
  # coexist on the same host. Without this rule, iroh's UDP traffic is
  # silently dropped by the COS host policy=DROP even though the GCE VPC
  # firewall `tenzro-gce-allow-iroh-quic` permits it. Matching VPC rule is
  # declared in `network.tf`; this opens the host firewall to match.
  - |
    iptables -C INPUT -p udp --dport 9001 -j ACCEPT 2>/dev/null \
      || iptables -I INPUT 1 -p udp --dport 9001 -j ACCEPT
  # Caddy on the RPC-public node terminates TLS for *.tenzro.network on
  # 80/443. Idempotent like the rule above. Harmless on non-RPC nodes
  # (Caddy isn't running there; the kernel just accepts packets to closed
  # ports, which RST/timeout the same as if the rule didn't exist).
  - |
    iptables -C INPUT -p tcp -m multiport --dports 80,443 -j ACCEPT 2>/dev/null \
      || iptables -I INPUT 1 -p tcp -m multiport --dports 80,443 -j ACCEPT
  # TCP keepalive tuning. COS ships stock Linux defaults (keepalive_time=7200,
  # i.e. 2 hours), but GCE's VPC fabric (Andromeda) silently evicts idle
  # conntrack entries after ~10 minutes WITHOUT sending RST — see
  # kubernetes/kubernetes#32457 and Google Cloud "general tips" docs. Without
  # tuning, long-lived libp2p TCP sessions between validators look ESTABLISHED
  # to both endpoints but get dropped by the fabric on the next write, after
  # which gossipsub silently degrades the mesh. Observed on 2026-05-14: 10-node
  # GCE testnet, mesh collapsed from 9 → 0-4 peers over ~1h uptime, chain stalled
  # at block 1291 with 110+ consecutive HotStuff-2 view timeouts.
  # Total keepalive window = time + intvl × probes = 120 + 30*4 = 240s, well
  # under the 600s VPC eviction threshold and the matching libp2p
  # connection_idle_timeout in tenzro-network's NetworkConfig::default().
  - sysctl -w net.ipv4.tcp_keepalive_time=120 net.ipv4.tcp_keepalive_intvl=30 net.ipv4.tcp_keepalive_probes=4
  - systemctl daemon-reload
  - systemctl enable --now tenzro-fetch-keys.service
  - systemctl enable --now tenzro-node.service
