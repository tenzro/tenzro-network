apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: tenzro-testnet
data:
  Caddyfile: |
    # JSON-RPC endpoint
    rpc.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With"
        defer
      }

      reverse_proxy tenzro-rpc-internal:8545

      log {
        output stdout
        format console
      }
    }

    # Web API endpoint (verification, status)
    # Passes through directly: api.tenzro.xyz/status → backend /status
    api.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With"
        defer
      }

      reverse_proxy tenzro-rpc-internal:8080

      log {
        output stdout
        format console
      }
    }

    # Faucet endpoint
    # POST faucet.tenzro.xyz → backend POST /faucet
    faucet.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With"
        defer
      }

      rewrite * /faucet
      reverse_proxy tenzro-rpc-internal:8080

      log {
        output stdout
        format console
      }
    }

    # MCP server endpoint (Model Context Protocol)
    # POST mcp.tenzro.xyz/mcp → backend POST /mcp
    mcp.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Mcp-Session-Id"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3001

      log {
        output stdout
        format console
      }
    }

    # A2A protocol endpoint (Agent-to-Agent)
    # GET a2a.tenzro.xyz/.well-known/agent.json → Agent Card discovery
    # POST a2a.tenzro.xyz/a2a → JSON-RPC 2.0 dispatcher
    # POST a2a.tenzro.xyz/a2a/stream → SSE streaming
    a2a.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3002

      log {
        output stdout
        format console
      }
    }

    # Solana MCP server
    solana-mcp.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Mcp-Session-Id"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3003

      log {
        output stdout
        format console
      }
    }

    # Ethereum MCP server
    ethereum-mcp.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Mcp-Session-Id"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3004

