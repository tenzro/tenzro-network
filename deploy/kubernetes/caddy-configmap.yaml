      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Mcp-Session-Id"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3005

      log {
        output stdout
        format console
      }
    }

    # LayerZero MCP server
    layerzero-mcp.tenzro.xyz {
      @options method OPTIONS
      respond @options 204

      header {
        Access-Control-Allow-Origin *
        Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, Mcp-Session-Id"
        defer
      }

      reverse_proxy tenzro-rpc-internal:3006

      log {
