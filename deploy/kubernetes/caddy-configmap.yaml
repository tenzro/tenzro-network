    # ---------------------------------------------------------------------
    # Application-hosting edge (per-operator — this is one operator's config)
    #
    # Each operator serves deployed sites under its OWN app domain, configured
    # in the node's `[hosting]` block. `apps.tenzro.xyz` below is this
    # reference operator's (Tenzro Labs') app domain — another operator
    # substitutes its own `app_domain` in the wildcard block. There is no
    # network-wide canonical host.
    #
    # Deployed sites get an automatic subdomain under the operator's app
    # domain and may attach a custom domain. TLS is provisioned by Caddy with
    # zero per-app work:
    #
    #   * the wildcard block serves every name under the operator's app
    #     domain from ONE certificate obtained via ACME DNS-01, so no
    #     certificate is issued per deployed site;
    #   * the on-demand block serves any other hostname (a user's custom
    #     domain) and issues its certificate lazily on the first TLS
    #     handshake, but only after the node's ask endpoint confirms the
    #     hostname is a verified custom-domain claim — this gates issuance so
    #     an unverified or hostile name cannot force certificate churn.
    #
    # The node's Web-API edge rewrites the Host header to the target site, so
    # both blocks simply reverse-proxy to the Web-API port; the node resolves
    # the alias / custom-domain to the site and serves it.
    # ---------------------------------------------------------------------

    # One certificate for every auto-assigned name under this operator's app
    # domain (ACME DNS-01). Substitute your own `app_domain` here.
    *.apps.tenzro.xyz {
      tls {
        dns <provider> {env.TENZRO_DNS_API_TOKEN}
        resolvers 1.1.1.1
      }

      reverse_proxy tenzro-rpc-internal:8080

      log {
        output stdout
        format console
      }
    }

    # Custom domains: certificate issued lazily, gated by the ask endpoint so
    # only verified claims are admitted.
    {
      on_demand_tls {
        ask http://tenzro-rpc-internal:8080/sites/tls-ask
      }
    }

    https:// {
      tls {
        on_demand
      }

      reverse_proxy tenzro-rpc-internal:8080

      log {
        output stdout
        format console
      }
    }
