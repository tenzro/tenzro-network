apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenzro-validator
  namespace: tenzro-testnet
  labels:
    app: tenzro
    component: validator
spec:
  serviceName: tenzro-validator
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: tenzro
      component: validator
  template:
    metadata:
      labels:
        app: tenzro
        component: validator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - validator
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          # Fix data directory ownership, then restore validator-0's p2p_key from
          # the Kubernetes Secret if the file is absent (e.g. after PVC deletion).
          # This ensures the peer ID never changes even if storage is wiped.
          command:
            - /bin/sh
            - -c
            - |
              chown -R 999:999 /data/tenzro
              ORDINAL=$(hostname | rev | cut -d- -f1 | rev)
              if [ "$ORDINAL" = "0" ] && [ ! -f /data/tenzro/p2p_key ]; then
                cp /p2p-identity/p2p_key /data/tenzro/p2p_key
                chown 999:999 /data/tenzro/p2p_key
                chmod 600 /data/tenzro/p2p_key
                echo "Restored p2p_key for tenzro-validator-0 from Secret"
              fi
          volumeMounts:
            - name: data
              mountPath: /data/tenzro
            - name: p2p-identity
              mountPath: /p2p-identity
              readOnly: true
      containers:
        - name: tenzro-node
          image: us-central1-docker.pkg.dev/tenzro-infra/tenzro/tenzro-node:latest
          imagePullPolicy: Always
          env:
            - name: DRPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tenzro-rpc-secrets
                  key: drpc-api-key
                  optional: true
            - name: TENZRO_SIMULATE_SEV
              value: "0"
            - name: TENZRO_SIMULATE_TDX
              value: "0"
            - name: TENZRO_SIMULATE_NITRO
              value: "0"
            - name: TENZRO_SIMULATE_GPU
              value: "0"
          # All pods run as full validators participating in HotStuff-2 consensus.
          # Pod 0 is the bootstrap node (stable peer ID from Secret); pods 1-2 dial
          # pod 0 for initial peer discovery, then all three form the consensus quorum.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ORDINAL=$(hostname | rev | cut -d- -f1 | rev)
              BOOT_NODE="/dns4/tenzro-validator-0.tenzro-validator.tenzro-testnet.svc.cluster.local/tcp/9000/p2p/12D3KooWEHW1ArBS3KasGXP6DKPpQS1hnM738LUEUWn5aP699yuw"
              if [ "$ORDINAL" = "0" ]; then
                echo "Starting as validator (block producer), ordinal=0"
                exec /usr/local/bin/tenzro-node \
                  --role validator \
                  --data-dir /data/tenzro \
                  --listen-addr /ip4/0.0.0.0/tcp/9000 \
                  --rpc-addr 0.0.0.0:8545 \
                  --genesis /config/genesis.toml \
                  --log-level info
              else
                echo "Starting as validator, ordinal=${ORDINAL}, boot=${BOOT_NODE}"
                exec /usr/local/bin/tenzro-node \
                  --role validator \
                  --data-dir /data/tenzro \
                  --listen-addr /ip4/0.0.0.0/tcp/9000 \
                  --rpc-addr 0.0.0.0:8545 \
                  --genesis /config/genesis.toml \
                  --boot-nodes "${BOOT_NODE}" \
                  --log-level info
              fi
          ports:
            - name: p2p
              containerPort: 9000
              protocol: TCP
            - name: rpc
              containerPort: 8545
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data/tenzro
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /verify/health
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /verify/health
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: tenzro-config
        - name: p2p-identity
          secret:
            secretName: tenzro-validator-0-p2p-identity
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
