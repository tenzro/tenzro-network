---
# PersistentVolumeClaim for RPC node data (survives pod restarts)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-tenzro-rpc
  namespace: tenzro-testnet
  labels:
    app: tenzro
    component: rpc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenzro-rpc
  namespace: tenzro-testnet
  labels:
    app: tenzro
    component: rpc
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for PVC with ReadWriteOnce
  selector:
    matchLabels:
      app: tenzro
      component: rpc
  template:
    metadata:
      labels:
        app: tenzro
        component: rpc
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /data/tenzro"]
          volumeMounts:
            - name: data
              mountPath: /data/tenzro
      containers:
        - name: tenzro-node
          image: us-central1-docker.pkg.dev/tenzro-operator-project/tenzro/tenzro-node:20260507-100757
          imagePullPolicy: Always
          env:
            - name: TENZRO_SIMULATE_SEV
              value: "0"
            - name: TENZRO_SIMULATE_TDX
              value: "0"
            - name: TENZRO_SIMULATE_NITRO
              value: "0"
            - name: TENZRO_SIMULATE_GPU
              value: "0"
            - name: TENZRO_MCP_AUTH
              value: "tiered"
            - name: TENZRO_A2A_PUBLIC_URL
              value: "https://a2a.tenzro.xyz"
            - name: DRPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tenzro-rpc-secrets
                  key: drpc-api-key
            - name: BOOT_NODES
              value: "/dns4/tenzro-validator-0.tenzro-validator.tenzro-testnet.svc.cluster.local/tcp/9000/p2p/12D3KooWEHW1ArBS3KasGXP6DKPpQS1hnM738LUEUWn5aP699yuw"
          # --role validator = full consensus participant, processes transactions directly
          args:
            - "--role"
            - "validator"
            - "--data-dir"
            - "/data/tenzro"
            - "--listen-addr"
            - "/ip4/0.0.0.0/tcp/9000"
            - "--rpc-addr"
            - "0.0.0.0:8545"
            - "--genesis"
            - "/config/genesis.toml"
            - "--boot-nodes"
            - "$(BOOT_NODES)"
            - "--mcp-addr"
            - "0.0.0.0:3001"
            - "--a2a-addr"
            - "0.0.0.0:3002"
            - "--solana-mcp-addr"
            - "0.0.0.0:3003"
            - "--ethereum-mcp-addr"
            - "0.0.0.0:3004"
            - "--canton-mcp-addr"
            - "0.0.0.0:3005"
            - "--layerzero-mcp-addr"
            - "0.0.0.0:3006"
            - "--chainlink-mcp-addr"
            - "0.0.0.0:3007"
            - "--lifi-mcp-addr"
            - "0.0.0.0:3008"
            - "--log-level"
            - "info"
          ports:
            - name: p2p
              containerPort: 9000
            - name: rpc
              containerPort: 8545
            - name: web
              containerPort: 8080
            - name: mcp
              containerPort: 3001
            - name: a2a
              containerPort: 3002
            - name: solana-mcp
              containerPort: 3003
            - name: eth-mcp
              containerPort: 3004
            - name: canton-mcp
              containerPort: 3005
            - name: lz-mcp
              containerPort: 3006
            - name: cl-mcp
              containerPort: 3007
            - name: lifi-mcp
              containerPort: 3008
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "1500m"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data/tenzro
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /verify/health
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /verify/health
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-tenzro-rpc
        - name: config
          configMap:
            name: tenzro-config
