# Persistent storage for Caddy TLS certificates
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: tenzro-testnet
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: tenzro-testnet
  labels:
    app: tenzro
    component: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tenzro
      component: caddy
  template:
    metadata:
      labels:
        app: tenzro
        component: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config-dir
          emptyDir: {}
---
# LoadBalancer service — the only external entry point
apiVersion: v1
kind: Service
metadata:
  name: caddy-lb
  namespace: tenzro-testnet
  labels:
    app: tenzro
    component: caddy
spec:
  type: LoadBalancer
  selector:
    app: tenzro
    component: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
