# The account the node runs as.
#
# It currently runs as a person, with a working directory in that person's home
# and its identities under ~/.tenzro. Those identities are the machine's
# participation in the network — a validator key and its wallets — and they must
# survive restarts and updates. Tying them to a login account means deleting
# that account destroys the node's place in the chain.
u tenzro - "Tenzro network node" /var/lib/tenzro /usr/sbin/nologin
