# Registry of timeseries ONNX export targets.
#
# Each [[target]] block describes one model the harness knows how to
# export. The `id` field is the local name used by `export.py`. The
# `context_length` and `max_horizon` fields will be consumed by the
# Tenzro `TimeseriesRuntime` when the resulting artifact is registered
# (`tenzro_loadForecastModel` RPC).
#
# Note: the entry currently shipped in `get_forecast_catalog`
# (TimesFM 2.5 200M) points at the community ONNX export at
# `pdufour/timesfm-2.5-200m-transformers-onnx`. The harness below is
# the fallback path for producing our own ONNX if that community
# export ever goes offline or falls behind upstream.

[[target]]
id = "timesfm-2.5-200m"
hf_repo = "google/timesfm-2.5-200m-pytorch"
arch = "timesfm"                # Decoder-only transformer with patch tokenizer
license = "Apache-2.0"
params = "200M"
context_length = 2048
max_horizon = 128
n_quantiles = 10
notes = "Decoder-only patch-tokenized transformer. Community export at pdufour/timesfm-2.5-200m-transformers-onnx pins batch_size=2 because of force_flip_invariance=true; any re-export must preserve that contract."
