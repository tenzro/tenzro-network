# Registry of timeseries ONNX export targets.
#
# Each [[target]] block describes one model the harness knows how to
# export. The `id` field is the local name used by `export.py`. The
# `context_length` and `max_horizon` fields will be consumed by the
# Tenzro `TimeseriesRuntime` when the resulting artifact is registered
# (`tenzro_loadForecastModel` RPC).
#
# Note: the TimesFM 2.5 200M entry in `get_forecast_catalog` points at
# the community ONNX export at
# `pdufour/timesfm-2.5-200m-transformers-onnx`. The harness below is
# the fallback path for producing our own ONNX if that community
# export ever goes offline or falls behind upstream.
#
# Only Apache-2.0 / MIT weights belong here — re-exporting produces an
# artifact we host ourselves, and `test_all_licenses_are_redistributable`
# enforces that.

[[target]]
id = "timesfm-2.5-200m"
hf_repo = "google/timesfm-2.5-200m-transformers"
arch = "timesfm"                # Decoder-only transformer with patch tokenizer
license = "Apache-2.0"
params = "200M"
context_length = 2048
max_horizon = 128
n_quantiles = 10
notes = "Decoder-only patch-tokenized transformer. The transformers-format repo is the maintained source: google/timesfm-2.5-200m-pytorch has not moved since 2025-10 and the community ONNX derives from the transformers layout. That export at pdufour/timesfm-2.5-200m-transformers-onnx pins batch_size=2 because of force_flip_invariance=true; any re-export must preserve that contract."

[[target]]
id = "chronos-2-small"
hf_repo = "autogluon/chronos-2-small"
revision = "ddec01313e50b6bc58ebaa92ede81bc24a3d9f9a"
arch = "chronos2"
license = "Apache-2.0"
params = "28M"
context_length = 5760
max_horizon = 672
n_quantiles = 13
notes = "Chronos-2 small. Inputs context, group_ids, attention_mask (f32), future_covariates and future_covariates_mask; output quantile_preds [B, 13, 672], quantile-major. Exported by Tenzro from the official weights."

