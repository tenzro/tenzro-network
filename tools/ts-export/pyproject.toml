[project]
name = "tenzro-ts-export"
version = "0.1.0"
description = "ONNX export harness for timeseries foundation models targeted by Tenzro Network"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenzro Network Contributors" }]

dependencies = [
    # Pinned to versions known to handle Chronos-Bolt's T5-derived encoder
    # and TimesFM's patch transformer. Update with care — torch/onnx/optimum
    # ABI churn breaks exports across minor versions.
    "torch>=2.4,<2.7",
    "transformers>=4.45,<4.50",
    "optimum>=1.23,<1.26",
    "onnx>=1.16,<1.18",
    "onnxruntime>=1.19,<1.22",
    "numpy>=1.26,<2.2",
    "tomli>=2.0; python_version<'3.11'",
    "huggingface_hub>=0.25,<0.30",
]

[project.scripts]
ts-export = "export:main"
ts-verify = "verify:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["export", "verify"]
