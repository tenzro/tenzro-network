# Registry of video ONNX export targets.
#
# Each [[target]] block describes one model the harness knows how to
# export. The `id` field is the local name used by `export.py`. The
# `frame_size`, `num_frames`, `fps`, and `embedding_dim` fields will be
# consumed by the Tenzro `VideoRuntime` when the resulting artifact is
# registered (`tenzro_loadVideoModel` RPC).
#
# V-JEPA 2 base is MIT-licensed per the model cards on
# `facebook/vjepa2-vitl-fpc64-256` and sibling repos. VideoMAE remains
# CC-BY-NC-4.0 and is gated behind `--accept-non-commercial`.

[[target]]
id = "vjepa2-vitl-fpc64-256"
hf_repo = "facebook/vjepa2-vitl-fpc64-256"
arch = "vjepa2"                  # ViT-L/16 base encoder, no fine-tuning head
license = "MIT"
params = "300M"
frame_size = 256
num_frames = 64                  # native fpc — V-JEPA 2 pretrained at 64 frames
fps = 4
embedding_dim = 1024
notes = "Base encoder. We trace with skip_predictor=True so only the encoder graph is exported (predictor head dropped). Mean-pool over the sequence axis to get a [B, 1024] clip embedding for retrieval/similarity. Native input is `pixel_values_videos: [B, 64, 3, 256, 256]` float32."

[[target]]
id = "videomae-base"
hf_repo = "MCG-NJU/videomae-base"
arch = "videomae"                # ViT-B/16 with tubelet patch embedding
license = "CC-BY-NC-4.0"          # non-commercial — see notes
params = "87M"
frame_size = 224
num_frames = 16
fps = 4
embedding_dim = 768
notes = "Tier A — straight encoder export, well-understood. License is CC-BY-NC-4.0 → registry will gate behind --accept-non-commercial."
