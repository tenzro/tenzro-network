[package]
name = "tenzro-bridge-stellar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
