[package]
name = "tenzro-settlement-lock-cosmwasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tenzro settlement-plan legs on CosmWasm chains: held until a proven Tenzro decision releases or refunds them"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "3", features = ["cosmwasm_2_1"] }
serde = { version = "1", default-features = false, features = ["derive"] }
hex = "0.4"
tenzro-finality-verifier = { path = "../../finality-verifier" }

[dev-dependencies]
cw-multi-test = { version = "3", features = ["cosmwasm_2_1"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace]
