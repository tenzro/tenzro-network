[package]
name = "tenzro-stellar-agent-account-factory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deploys Tenzro agent accounts on Stellar at the address each agent's DID fixes"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils", "hazmat-address"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
