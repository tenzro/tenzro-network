[package]
name = "tenzro-stellar-agent-account"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tenzro agent accounts on Stellar: grants proven under Tenzro finality, actions signed by serving nodes' P-256 keys"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "28", features = ["hazmat-address"] }
tenzro-finality-verifier = { path = "../finality-verifier" }

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils", "hazmat-address"] }
tenzro-stellar-finality = { path = "../stellar-finality" }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
