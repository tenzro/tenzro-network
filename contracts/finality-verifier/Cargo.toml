[package]
name = "tenzro-finality-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tenzro finality proofs (RISC Zero Groth16 receipts) checked on other chains"
publish = false

[features]
# BN254 computed in software, for chains without curve natives.
arkworks = ["dep:ark-bn254", "dep:ark-ec", "dep:ark-ff"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"], optional = true }
ark-ec = { version = "0.5", default-features = false, optional = true }
ark-ff = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[workspace]
