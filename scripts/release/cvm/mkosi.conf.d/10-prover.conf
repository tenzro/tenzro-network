# The prover image: the node image plus the finality prover and the Groth16
# prover container it wraps proofs in, so proofs made on the machine can be
# bound to its attestation.

[Match]
Profiles=prover

[Output]
ImageId=tenzro-cvm-prover
Output=tenzro-cvm-prover

[Content]
Packages=
        podman
        podman-docker
        skopeo
        crun
ExtraTrees=%D/prover.extra
