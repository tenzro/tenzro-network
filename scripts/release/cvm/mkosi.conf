# The confidential VM image of the Tenzro node: one UEFI disk for Intel TDX and
# AMD SEV-SNP guests. The node is baked into a read-only root file system
# protected by dm-verity, and the kernel, initrd and command line (which
# carries the verity root hash) form one unified kernel image, the only EFI
# binary on the disk. Its digest is therefore the measurement of everything
# the guest runs. scripts/release/build-cvm-image.sh drives this
# configuration; it pins the package mirror to a snapshot and the timestamps
# to the release commit, so two builds of the same inputs are bit-identical.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main

[Output]
Format=disk
ImageId=tenzro-cvm
Output=tenzro-cvm
CompressOutput=no
SplitArtifacts=uki
Seed=6a3f1c0e-2b4d-4c55-9a7e-3d1f0b8e5c21

[Build]
WithNetwork=no

[Content]
Bootable=yes
Bootloader=uki
UnifiedKernelImages=yes
KernelCommandLine=console=ttyS0,115200 systemd.show_status=1 systemd.firstboot=no panic=30
Hostname=tenzro
Locale=C.UTF-8
Timezone=UTC
WithDocs=no
CleanPackageMetadata=yes
KernelModulesInitrdInclude=default
                           erofs
                           dm-verity
                           virtio_scsi
                           sd_mod
Packages=
        linux-image-cloud-amd64
        systemd
        systemd-sysv
        systemd-boot-efi
        systemd-resolved
        systemd-repart
        systemd-cryptsetup
        udev
        kmod
        e2fsprogs
        tpm-udev
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
        libssl3t64
        libstdc++6
        ca-certificates
        curl
        jq
        gzip
        iproute2
RemoveFiles=
        /var/log
        /var/cache
        /usr/share/doc
        /usr/share/man
